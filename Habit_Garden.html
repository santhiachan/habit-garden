   label: (getLang()==='en' ? ['S','M','T','W','T','F','S'] : ['日','一','二','三','四','五','六'])[d.getDay()],\n      count: (state.completions[key] || []).length,\n      sleep: state.sleep[key]\n    });\n  }\n  const maxCount = Math.max(...days.map(d => d.count), 3);\n  const html = `\n    <div style=\"display: flex; gap: 8px; align-items: flex-end; height: 120px; padding: 0 4px;\">\n      ${days.map(d => {\n        const h = (d.count / maxCount) * 100;\n        const sleepIcon = d.sleep === 'before23' ? '⭐' : d.sleep === 'before24' ? '🙂' : d.sleep === 'before1' ? '😐' : d.sleep === 'late' ? '🌙' : '';\n        return `\n          <div style=\"flex:1; display: flex; flex-direction: column; align-items: center; gap: 4px;\">\n            <div style=\"font-size: 11px; color: var(--ink-soft);\">${d.count}<\u002Fdiv>\n            <div style=\"width: 100%; height: ${Math.max(h, 4)}%; background: linear-gradient(180deg, var(--butter), var(--peach)); border-radius: 6px 6px 0 0; min-height: 4px;\"><\u002Fdiv>\n            <div style=\"font-size: 11px; color: var(--ink-soft);\">${d.label}<\u002Fdiv>\n            <div style=\"font-size: 12px;\">${sleepIcon}<\u002Fdiv>\n          <\u002Fdiv>\n        `;\n      }).join('')}\n    <\u002Fdiv>\n    <div style=\"margin-top: 12px; font-size: 12px; color: var(--ink-soft); text-align: center;\">${T('柱子 = 完成任务数，图标 = 那晚的睡眠','Bars = tasks done, icons = sleep that night')}<\u002Fdiv>\n  `;\n  document.getElementById('weekChart').innerHTML = html;\n}\n\nfunction renderSleepStatus() {\n  const t = todayStr();\n  const s = state.sleep[t];\n  document.querySelectorAll('.sleep-btn').forEach(b => {\n    b.classList.toggle('logged', b.dataset.sleep === s);\n  });\n  const txt = getLang()==='en' ? {\n    before23: `Lovely! Before 23:00 · ${state.pet.name} will dream sweetly 🌟`,\n    before24: 'Decent timing · keep it up',\n    before1: 'A bit late · try a little earlier tomorrow?',\n    late: 'Pulling a late one ~ be gentle with yourself tomorrow',\n  } : {\n    before23: `太棒了！23点前睡 · ${state.pet.name}会做个好梦 🌟`,\n    before24: '不错的时间 · 继续保持哦',\n    before1: '有点晚了 · 明天争取早一点?',\n    late: '熬夜啦~ 明天对自己温柔一点',\n  };\n  document.getElementById('sleepStatus').textContent = s ? txt[s] : T(`点击记录今晚睡眠 · 23点前上床可让${state.pet.name}额外成长`, `Tap to log tonight’s sleep · in bed before 23:00 helps ${state.pet.name} grow extra`);\n}\n\nlet editingTaskId = null;\nfunction openTaskModal(task = null) {\n  editingTaskId = task ? task.id : null;\n  document.getElementById('taskModalTitle').textContent = task ? '编辑任务' : '新任务';\n  document.getElementById('taskNameInput').value = task ? task.name : '';\n  document.getElementById('taskDimInput').value = task ? task.dim : 'wisdom';\n  document.getElementById('taskDifficultyInput').value = task ? task.difficulty : 2;\n  document.getElementById('taskTypeInput').value = task ? task.type : 'daily';\n  document.getElementById('taskModal').classList.add('active');\n  setTimeout(() => document.getElementById('taskNameInput').focus(), 100);\n}\nfunction closeTaskModal() {\n  document.getElementById('taskModal').classList.remove('active');\n  editingTaskId = null;\n}\nfunction saveTask() {\n  const name = document.getElementById('taskNameInput').value.trim();\n  if (!name) { toast(T('给任务起个名字吧~','Give this task a name ~'), '✏'); return; }\n  const payload = {\n    name,\n    dim: document.getElementById('taskDimInput').value,\n    difficulty: parseInt(document.getElementById('taskDifficultyInput').value),\n    type: document.getElementById('taskTypeInput').value,\n  };\n  if (editingTaskId) {\n    const t = state.tasks.find(t => t.id === editingTaskId);\n    Object.assign(t, payload);\n  } else {\n    state.tasks.push({ id: uid(), ...payload, createdAt: Date.now() });\n  }\n  save();\n  closeTaskModal();\n  renderAll();\n  toast(editingTaskId ? T('更新啦~','Updated ~') : T('新任务添加成功！','New task added!'), '✨');\n}\n\nfunction openShopEditModal() {\n  document.getElementById('shopNameInput').value = '';\n  document.getElementById('shopIconInput').value = '';\n  document.getElementById('shopPriceInput').value = 50;\n  document.getElementById('shopDescInput').value = '';\n  document.getElementById('shopLimitInput').value = 1;\n  document.getElementById('shopModal').classList.add('active');\n  setTimeout(() => document.getElementById('shopNameInput').focus(), 100);\n}\nfunction closeShopModal() { document.getElementById('shopModal').classList.remove('active'); }\nfunction saveShopItem() {\n  const name = document.getElementById('shopNameInput').value.trim();\n  if (!name) { toast(T('给奖励起个名字~','Give this reward a name ~'), '🎁'); return; }\n  state.shopItems.push({\n    id: uid(),\n    name,\n    icon: document.getElementById('shopIconInput').value.trim() || '🎁',\n    price: parseInt(document.getElementById('shopPriceInput').value) || 50,\n    limit: parseInt(document.getElementById('shopLimitInput').value) || 0,\n    desc: document.getElementById('shopDescInput').value.trim()\n  });\n  save();\n  closeShopModal();\n  renderAll();\n  toast(T('新奖励加入许愿店！','New reward added to wishes!'), '🌷');\n}\n\nfunction renamePet() {\n  const n = prompt(getLang()==='en' ? 'Give your bean a name~' : '给你的小伙伴起个名字~', state.pet.name);\n  if (n && n.trim()) {\n    state.pet.name = n.trim().slice(0, 10);\n    save();\n    renderAll();\n  }\n}\n\n/* ============ Language toggle ============ */\nconst I18N_MAP = {\n  app_title: { zh: '习惯小花园', en: 'Habit Garden' },\n  tab_home: { zh: '🏡 主页', en: '🏡 Home' },\n  tab_tasks: { zh: '📋 任务', en: '📋 Tasks' },\n  tab_shop: { zh: '🎁 许愿店', en: '🎁 Wishes' },\n  tab_cards: { zh: '🃏 卡册', en: '🃏 Cards' },\n  tab_focus: { zh: '⏱ 专注', en: '⏱ Focus' },\n  tab_log: { zh: '🌙 记录', en: '🌙 Log' },\n  pat_btn: { zh: '🫶 摸摸它', en: '🫶 Pat pat' },\n  stars: { zh: '星星', en: 'Stars' },\n  streak: { zh: '连续', en: 'Streak' },\n  power: { zh: '综合战斗力', en: 'Total power' },\n  today_quest: { zh: '今日主线', en: 'Today\\u2019s quests' },\n  today_quest_sub: { zh: '今天只挑 3-5 件，不贪多 🌿', en: 'Pi ything' },\n  comfort: { zh: '今天有点不行', en: 'Today’s a bit much' },\n  // modals\n  new_task_h: { zh: '新任务', en: 'New task' },\n  edit_task_h: { zh: '编辑任务', en: 'Edit task' },\n  task_name: { zh: '任务名称', en: 'Task name' },\n  task_name_ph: { zh: '例如：读书 30 分钟', en: 'e.g. Read for 30 minutes' },\n  task_dim: { zh: '所属维度（决定加哪项能力）', en: 'Dimension (which stat it grows)' },\n  task_diff: { zh: '难度（决定奖励）', en: 'Difficulty (decides reward)' },\n  d1: { zh: '🌱 小事 (+5)', en: '🌱 Tiny (+5)' },\n  d2: { zh: '🌿 一般 (+15)', en: '🌿 Normal (+15)' },\n  d3: { zh: '🌳 挑战 (+30)', en: '🌳 Challenge (+30)' },\n  d4: { zh: '🌲 大事 (+60)', en: '🌲 Big deal (+60)' },\n  task_type: { zh: '类型', en: 'Type' },\n  daily_short: { zh: '每日', en: 'Daily' },\n  once_short: { zh: '一次性', en: 'One-time' },\n  cancel: { zh: '取消', en: 'Cancel' },\n  save: { zh: '保存', en: 'Save' },\n  add_reward_h: { zh: '添加我想要的奖励', en: 'Add a reward I want' },\n  add_reward_intro: { zh: '写下你平时会\"偷懒\"的事，或者一直舍不得花时间的事 🌷', en: 'Write down the things you usually \\u201cslack off\\u201d to do, or things you never let yourself spend time on 🌷' },\n  reward_name: { zh: '奖励名字', en: 'Reward name' },\n  reward_name_ph: { zh: '例如：看一集喜欢的剧', en: 'e.g. Watch an episode of a favorite show' },\n  reward_icon: { zh: '图标（一个 emoji）', en: 'Icon (one emoji)' },\n  reward_price: { zh: '需要星星', en: 'Stars needed' },\n  reward_limit: { zh: '每天最多兑换', en: 'Max redemptions per day' },\n  unlimited: { zh: '不限', en: 'Unlimited' },\n  l1: { zh: '1 次', en: '1×' },\n  l2: { zh: '2 次', en: '2×' },\n  l3: { zh: '3 次', en: '3×' },\n  reward_desc: { zh: '描述（可选）', en: 'Description (optional)' },\n  reward_desc_ph: { zh: '给未来的自己一句话', en: 'A note to your future self' },\n};\nfunction getLang(){ return localStorage.getItem('hg_lang') || 'zh'; }\nfunction T(zh, en){ return getLang()==='en' ? en : zh; }\nfunction setLang(l){\n  localStorage.setItem('hg_lang', l);\n  document.documentElement.lang = (l==='en' ? 'en' : 'zh-CN');\n  document.querySelectorAll('[data-i18n]').forEach(el=>{\n    const k = el.getAttribute('data-i18n');\n    if(I18N_MAP[k]) el.textContent = I18N_MAP[k][l];\n  });\n  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{\n    const k = el.getAttribute('data-i18n-ph');\n    if(I18N_MAP[k]) el.placeholder = I18N_MAP[k][l];\n  });\n  const btn = document.getElementById('langToggle');\n  if(btn) btn.textContent = (l==='en' ? 'EN / 中' : '中 / EN');\n  // re-render dynamic JS-rendered content\n  if (typeof renderAll === 'function' && state && state.pet) renderAll();\n}\nfunction toggleLang(){ setLang(getLang()==='en' ? 'zh' : 'en'); }\n\n/* ============ Pet pat interaction ============ */\nconst PAT_LINES = {\n  zh: ['咕~ 被摸到啦~','舒服 ♡','嘿嘿好痒','再摸一下嘛','谢谢你呀 🌸','心里亮亮的','今天也爱你','🫧 软软的','你比阳光还暖','嗷~ 又一下！','抱抱反击！','陪你一起慢慢长'],\n  en: ['Purr~ ♡','So cozy','Hehe tickles','One more please','Thank you 🌸','Glowing inside','Love you today','🫧 so soft','Warmer than sun','Eep! again!','Hug attack!','Growing with you']\n};\nlet _patTimer = null;\nfunction patPet(){\n  const fb = document.getElementById('patFeedback');\n  if(!fb) return;\n  const arr = PAT_LINES[getLang()] || PAT_LINES.zh;\n  fb.textContent = arr[Math.floor(Math.random()*arr.length)];\n  fb.style.opacity = '1';\n  const svg = document.getElementById('petSvg');\n  if(svg){ svg.style.transition='transform .15s'; svg.style.transform='scale(1.08)';\n    setTimeout(()=>{ svg.style.transform=''; }, 160);\n  }\n  releasePatHearts();\n  clearTimeout(_patTimer);\n  _patTimer = setTimeout(()=>{ fb.style.opacity='0'; }, 1000);\n}\n\n/* Release 1–2 pink hearts that float up & fade from the plant area on pat. */\nfunction releasePatHearts(){\n  const host = document.querySelector('.pet-stage-container');\n  if (!host) return;\n  // Make sure the container can anchor absolutely-positioned children.\n  const cs = getComputedStyle(host);\n  if (cs.position === 'static') host.style.position = 'relative';\n  const n = 1 + Math.floor(Math.random()*2); // 1 or 2\n  const rect = host.getBoundingClientRect();\n  const cx = rect.width / 2;\n  // Anchor hearts near where the seed/plant sits (lower half of the stage)\n  const cy = rect.height * 0.55;\n  for (let i=0; i<n; i++) {\n    const h = document.createElement('div');\n    h.textContent = '💕';\n    const dx = (Math.random() - 0.5) * 60 - (n===2 ? (i===0?22:-22) : 0);\n    const rot = (Math.random() * 30 - 15) | 0;\n    const size = 22 + Math.floor(Math.random()*8);\n    Object.assign(h.style, {\n      position: 'absolute',\n      left: (cx + dx) + 'px',\n      top: cy + 'px',\n      fontSize: size + 'px',\n      color: '#f3a5d0',\n      pointerEvents: 'none',\n      transform: `translate(-50%, -50%) rotate(${rot}deg) scale(0.4)`,\n      opacity: '0',\n      transition: 'transform 1.1s cubic-bezier(.2,.8,.3,1), opacity 1.1s ease-out',\n      zIndex: 20,\n      filter: 'drop-shadow(0 1px 0 rgba(217,122,176,.4))',\n    });\n    host.appendChild(h);\n    // Next frame: animate up and fade.\n    requestAnimationFrame(() => {\n      h.style.opacity = '1';\n      h.style.transform = `translate(-50%, -50%) translateY(-70px) rotate(${rot}deg) scale(1.05)`;\n      setTimeout(() => {\n        h.style.opacity = '0';\n        h.style.transform = `translate(-50%, -50%) translateY(-110px) rotate(${rot}deg) scale(0.9)`;\n      }, 500);\n    });\n    setTimeout(() => h.remove(), 1200);\n  }\n}\n\n/* ============ Mood tracker ============ */\nconst MOOD_PRESETS = [\n  {k:'happy',    zh:'开心',   en:'Happy',    emoji:'😊', color:'#f3d388'},\n  {k:'calm',     zh:'平静',   en:'Calm',     emoji:'🌿', color:'#a9cbd8'},\n  {k:'tired',    zh:'疲惫',   en:'Tired',    emoji:'😮‍💨', color:'#c4b5d9'},\n  {k:'anxious',  zh:'焦虑',   en:'Anxious',  emoji:'🌀', color:'#e8a5a5'},\n  {k:'grateful', zh:'感恩',   en:'Grateful', emoji:'🫶', color:'#f2a78d'},\n  {k:'excited',  zh:'兴奋',   en:'Excited',  emoji:'✨', color:'#f3a5d0'},\n  {k:'sad',      zh:'难过',   en:'Sad',      emoji:'🌧', color:'#7ba3b5'},\n  {k:'focused',  zh:'专注',   en:'Focused',  emoji:'🎯', color:'#7a9b6e'},\n  {k:'lazy',     zh:'摆烂',   en:'Lazy',     emoji:'🛌', color:'#b8a98a'},\n  {k:'loved',    zh:'被爱',   en:'Loved',    emoji:'💗', color:'#f2a78d'},\n];\nlet _moodRange = 'week';\nfunction moodLabel(m){ const p = MOOD_PRESETS.find(x=>x.k===m.k); if(p) return (getLang()==='en'?p.en:p.zh); return m.label || m.k; }\nfunction moodEmoji(m){ const p = MOOD_PRESETS.find(x=>x.k===m.k); return p ? p.emoji : (m.emoji || '🏷'); }\nfunction moodColor(m){ const p = MOOD_PRESETS.find(x=>x.k===m.k); return p ? p.color : '#d8c8b0'; }\nfunction logMood(mood){\n  const t = todayStr();\n  if(!state.moods) state.moods = {};\n  if(!state.moods[t]) state.moods[t] = [];\n  if(!state.moods[t].find(m => m.k === mood.k)){\n    state.moods[t].push(mood);\n    save(); renderMood();\n    toast((getLang()==='en'?'Mood logged ':'心情已记录 ') + moodEmoji(mood), '🌸');\n  } else {\n    toast(getLang()==='en'?'Already logged today':'今天已经记录过啦','🌼');\n  }\n}\nfunction removeTodayMood(k){\n  const t = todayStr();\n  if(!state.moods || !state.moods[t]) return;\n  state.moods[t] = state.moods[t].filter(m => m.k !== k);\n  save(); renderMood();\n}\nfunction addCustomMood(){\n  const inp = document.getElementById('moodCustomInput');\n  const v = (inp.value || '').trim();\n  if(!v) return;\n  const k = 'c_' + v.toLowerCase().replace(/\\s+/g,'_');\n  if(!state.customMoods) state.customMoods = [];\n  if(!state.customMoods.find(m => m.k === k)){\n    state.customMoods.push({k, label:v, emoji:'🏷'});\n  }\n  logMood({k, label:v, emoji:'🏷'});\n  inp.value = '';\n}\nfunction removeCustomMood(k){\n  if(!state.customMoods) return;\n  state.customMoods = state.customMoods.filter(m => m.k !== k);\n  save(); renderMood();\n}\nfunction setMoodRange(r){ _moodRange = r; renderMood(); }\nfunction renderMood(){\n  const chipsEl = document.getElementById('moodChips');\n  if(!chipsEl) return;\n  const en = getLang()==='en';\n  document.getElementById('moodPanelTitle').textContent = en ? \"Today's mood · pick keywords\" : '今日心情 · 选一个关键词';\n  document.getElementById('moodCustomInput').placeholder = en ? 'Add your own keyword...' : '自由添加一个心情词...';\n  document.getElementById('moodAddBtn').textContent = en ? 'Add & log' : '添加并记录';\n  document.getElementById('mrWeek').textContent = en ? 'Week' : '周';\n  document.getElementById('mrMonth').textContent = en ? 'Month' : '月';\n  document.getElementById('mrYear').textContent = en ? 'Year' : '年';\n\n  const t = todayStr();\n  const todays = (state.moods && state.moods[t]) || [];\n  const todayKeys = new Set(todays.map(m=>m.k));\n  const presets = MOOD_PRESETS.map(p => ({k:p.k, label: en?p.en:p.zh, emoji:p.emoji, color:p.color}));\n  const customs = (state.customMoods || []).map(m => ({...m, color:'#d8c8b0'}));\n  const all = [...presets, ...customs];\n  chipsEl.innerHTML = all.map((m, i) => {\n    const on = todayKeys.has(m.k);\n    const isCustom = m.k.startsWith('c_');\n    return `<button data-mood-idx=\"${i}\"\n      style=\"background:${on ? m.color : 'var(--cream-2)'}; color:${on?'#fff':'var(--ink)'}; border:none; border-radius:999px; padding:6px 14px; font-family:inherit; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;\">\n      <span>${m.emoji}<\u002Fspan><span>${escapeHtml(m.label)}<\u002Fspan>\n      ${isCustom ? `<span data-remove-custom=\"${m.k}\" style=\"opacity:.5; margin-left:4px;\">×<\u002Fspan>`:''}\n    <\u002Fbutton>`;\n  }).join('');\n  // Bind clicks safely (avoids quote-escaping issues inside inline onclick)\n  chipsEl.querySelectorAll('button[data-mood-idx]').forEach(btn => {\n    btn.addEventListener('click', (e) => {\n      const rm = e.target.closest('[data-remove-custom]');\n      if (rm) { e.stopPropagation(); removeCustomMood(rm.getAttribute('data-remove-custom')); return; }\n      const idx = parseInt(btn.getAttribute('data-mood-idx'), 10);\n      const m = all[idx];\n      if (m) logMood({k: m.k, label: m.label, emoji: m.emoji});\n    });\n  });\n\n  const tagsEl = document.getElementById('moodTodayTags');\n  tagsEl.innerHTML = todays.length\n    ? `<div style=\"font-size:13px; color:var(--ink-soft); margin-bottom:6px;\">${en?'Today':'今天'}<\u002Fdiv>` +\n      todays.map(m => `<span style=\"display:inline-flex; align-items:center; gap:4px; background:${moodColor(m)}; color:#fff; padding:4px 10px; border-radius:999px; font-size:12px; margin:0 6px 6px 0;\">${moodEmoji(m)} ${moodLabel(m)} <span onclick=\"removeTodayMood('${m.k}')\" style=\"cursor:pointer; opacity:.7; margin-left:4px;\">×<\u002Fspan><\u002Fspan>`).join('')\n    : `<div class=\"empty\" style=\"padding:8px 0;\">${en?'Pick a keyword to mark how you feel today':'选一个关键词记录今天'}<\u002Fdiv>`;\n\n  // statistics\n  const now = new Date();\n  const days = _moodRange === 'week' ? 7 : _moodRange === 'month' ? 30 : 365;\n  const cutoff = new Date(); cutoff.setDate(now.getDate() - days + 1); cutoff.setHours(0,0,0,0);\n  const counts = {};\n  Object.entries(state.moods || {}).forEach(([dk, arr]) => {\n    const d = new Date(dk);\n    if(d >= cutoff){\n      arr.forEach(m => {\n        const key = m.k;\n        const label = moodLabel(m);\n        const emoji = moodEmoji(m);\n        const color = moodColor(m);\n        if(!counts[key]) counts[key] = {count:0, label, emoji, color};\n        counts[key].count++;\n      });\n    }\n  });\n  const entries = Object.entries(counts).sort((a,b)=>b[1].count-a[1].count);\n  const total = entries.reduce((a,[,v])=>a+v.count, 0);\n  const hint = document.getElementById('moodRangeHint');\n  hint.textContent = en\n    ? `${total} logs · last ${days==7?'week':days==30?'month':'year'}`\n    : `共 ${total} 次 · 最近${days==7?'一周':days==30?'一月':'一年'}`;\n  ['mrWeek','mrMonth','mrYear'].forEach(id=>{\n    const el = document.getElementById(id);\n    const active = (id==='mrWeek'&&_moodRange==='week')||(id==='mrMonth'&&_moodRange==='month')||(id==='mrYear'&&_moodRange==='year');\n    el.style.background = active ? 'var(--moss)' : 'var(--cream-2)';\n    el.style.color = active ? '#fff' : 'var(--ink)';\n  });\n\n  const statsEl = document.getElementById('moodStats');\n  if(!entries.length){\n    statsEl.innerHTML = `<div class=\"empty\" style=\"padding:14px 0;\">${en?'No moods logged yet in this range':'这段时间还没有记录心情呢'}<\u002Fdiv>`;\n  } else {\n    const max = entries[0][1].count;\n    statsEl.innerHTML = entries.map(([k, v]) => {\n      const pct = Math.round(v.count / max * 100);\n      const pctTotal = Math.round(v.count / total * 100);\n      return `<div style=\"display:flex; align-items:center; gap:10px; margin-bottom:8px;\">\n        <div style=\"width:110px; font-size:13px; display:flex; align-items:center; gap:6px; flex-shrink:0;\">\n          <span>${v.emoji}<\u002Fspan><span>${v.label}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1; background:var(--cream-2); border-radius:999px; height:16px; overflow:hidden;\">\n          <div style=\"width:${pct}%; height:100%; background:${v.color}; transition: width .3s;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:72px; text-align:right; font-size:12px; color:var(--ink-soft);\">${v.count} · ${pctTotal}%<\u002Fdiv>\n      <\u002Fdiv>`;\n    }).join('');\n  }\n}\n\nlet focusInterval = null;\nlet focusEndTime = null;\nlet focusDuration = 0;\nlet focusStarted = false;\nlet focusHalfDone = false;\n\nfunction startFocus() {\n  const name = document.getElementById('focusTaskName').value.trim() || T('专注时间','Focus time');\n  focusDuration = parseInt(document.getElementById('focusDuration').value);\n  focusEndTime = Date.now() + focusDuration * 60000;\n  focusStarted = true;\n  focusHalfDone = false;\n  document.getElementById('focusStartBtn').style.display = 'none';\n  document.getElementById('focusStopBtn').style.display = 'block';\n  document.getElementById('focusDoneBtn').style.display = 'none';\n  document.getElementById('timerLabel').textContent = T('专注中：','Focusing: ') + name;\n  focusInterval = setInterval(updateFocusTimer, 500);\n}\n\nfunction updateFocusTimer() {\n  const now = Date.now();\n  const remaining = Math.max(0, focusEndTime - now);\n  const mm = Math.floor(remaining / 60000);\n  const ss = Math.floor((remaining % 60000) / 1000);\n  document.getElementById('timerTime').textContent = `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;\n  const elapsed = focusDuration * 60000 - remaining;\n  if (elapsed >= 300000 && !focusHalfDone) {\n    focusHalfDone = true;\n    document.getElementById('focusDoneBtn').style.display = 'block';\n    toast(T('坚持了 5 分钟！可以领启动奖励啦~','Made it 5 minutes! Start-up reward unlocked ~'), '🌱');\n  }\n  if (remaining === 0) {\n    clearInterval(focusInterval);\n    completeFocus();\n  }\n}\n\nfunction completeFocus() {\n  const name = document.getElementById('focusTaskName').value.trim() || T('专注时间','Focus time');\n  const xp = Math.max(5, focusDuration);\n  const stars = Math.max(3, Math.floor(focusDuration * 0.6));\n  state.pet.xp += xp;\n  state.stars += stars;\n  state.dims.wisdom += Math.ceil(xp / 4);\n  const newStage = getPetStage();\n  if (newStage > state.pet.stage) state.pet.stage = newStage;\n  save();\n  resetFocusUI();\n  toast(T(`完整专注 ${focusDuration} 分钟！+${xp}xp +${stars}✨ 太棒了！`, `Full ${focusDuration}-min focus! +${xp}xp +${stars}✨ amazing!`), '🎉');\n  renderAll();\n}\n\nfunction stopFocus(completed) {\n  clearInterval(focusInterval);\n  if (completed && focusHalfDone) {\n    const xp = Math.max(3, Math.floor(focusDuration * 0.5));\n    const stars = Math.max(2, Math.floor(focusDuration * 0.3));\n    state.pet.xp += xp;\n    state.stars += stars;\n    state.dims.wisdom += Math.ceil(xp / 4);\n    save();\n    toast(T(`启动奖励到手！+${xp}xp +${stars}✨`, `Start-up reward! +${xp}xp +${stars}✨`), '🌱');\n    const newStage = getPetStage();\n    if (newStage > state.pet.stage) state.pet.stage = newStage;\n  } else if (!completed && focusHalfDone) {\n    const xp = Math.max(3, Math.floor(focusDuration * 0.3));\n    state.pet.xp += xp;\n    state.stars += Math.floor(xp / 2);\n    save();\n    toast(T(`坐下来就是胜利 +${xp}xp`, `Sitting down is the win +${xp}xp`), '🫂');\n  } else {\n    toast(T('没关系，下次再来 🌿','It’s ok, try again next time 🌿'), '🫂');\n  }\n  resetFocusUI();\n  renderAll();\n}\n\nfunction resetFocusUI() {\n  focusStarted = false;\n  focusHalfDone = false;\n  document.getElementById('focusStartBtn').style.display = 'block';\n  document.getElementById('focusStopBtn').style.display = 'none';\n  document.getElementById('focusDoneBtn').style.display = 'none';\n  document.getElementById('timerTime').textContent = '25:00';\n  document.getElementById('timerLabel').textContent = T('准备一段温柔的专注','Ready for a gentle focus session');\n}\n\nfunction toast(msg, icon = '✨') {\n  const el = document.createElement('div');\n  el.className = 'toast';\n  el.innerHTML = `<span style=\"font-size: 20px;\">${icon}<\u002Fspan>${msg}`;\n  document.getElementById('toastContainer').appendChild(el);\n  setTimeout(() => el.remove(), 3200);\n}\n\nfunction exportData() {\n  const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = `habit-garden-${todayStr()}.json`;\n  a.click();\n  URL.revokeObjectURL(url);\n}\nfunction importData() {\n  const input = document.createElement('input');\n  input.type = 'file';\n  input.accept = '.json';\n  input.onchange = e => {\n    const file = e.target.files[0];\n    const reader = new FileReader();\n    reader.onload = ev => {\n      try {\n        state = JSON.parse(ev.target.result);\n        save();\n        renderAll();\n        toast(T('数据已导入','Data imported'), '📥');\n      } catch(err) { toast(T('文件有问题~','File seems off ~'), '⚠'); }\n    };\n    reader.readAsText(file);\n  };\n  input.click();\n}\nfunction resetData() {\n  if (!confirm(T(`真的要全部重置吗？${state.pet.name}会重新成为一颗种子。`, `Really reset everything? ${state.pet.name} will become a seed again.`))) return;\n  if (!confirm(T('再次确认：所有进度都会消失！','Confirm again: all progress will be lost!'))) return;\n  localStorage.removeItem(LS_KEY);\n  location.reload();\n}\n\nfunction escapeHtml(str) {\n  return String(str)\n    .replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;')\n    .replace(/\"/g,'&quot;').replace(/'/g,'&#39;');\n}\n\ndocument.querySelectorAll('.tab').forEach(t => {\n  t.addEventListener('click', () => {\n    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));\n    t.classList.add('active');\n    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));\n    document.getElementById('view-' + t.dataset.view).classList.add('active');\n  });\n});\n\ndocument.querySelectorAll('.modal-overlay').forEach(m => {\n  m.addEventListener('click', e => {\n    if (e.target === m) m.classList.remove('active');\n  });\n});\n\nload();\nseedDefaults();\nrenderAll();\nsetLang(getLang());\n\n// Wire up comfort modal close buttons\n(() => {\n  const closeBtn = document.getElementById('comfortCloseBtn');\n  const hugBtn = document.getElementById('comfortHugBtn');\n  if (closeBtn) closeBtn.addEventListener('click', closeComfortModal);\n  if (hugBtn) hugBtn.addEventListener('click', closeComfortModal);\n})();\n\nif (!state.settings.seenWelcome) {\n  setTimeout(() => {\n    toast(T(`欢迎回来~ ${state.pet.name}在等你 🌱`, `Welcome back ~ ${state.pet.name} is waiting 🌱`), '🌷');\n    state.settings.seenWelcome = true;\n    save();\n  }, 500);\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
