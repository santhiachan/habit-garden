ss=\"sub\" data-i18n=\"all_tasks_sub\">习惯的小田地<\u002Fspan>\n      <\u002Fdiv>\n      <button class=\"btn btn-primary\" data-i18n=\"new_task\" style=\"padding: 10px 20px; flex: 0 0 auto;\" onclick=\"openTaskModal()\">+ 新任务<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"panel\">\n      <div class=\"panel-title\" data-i18n=\"one_time\">一次性任务<\u002Fdiv>\n      <div class=\"panel-sub\" data-i18n=\"one_time_sub\">做完就消失，适合一次性挑战<\u002Fdiv>\n      <div class=\"task-list\" id=\"oneTimeList\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"panel\" style=\"margin-top: 20px;\">\n      <div class=\"panel-title\" data-i18n=\"daily\">每日/定期<\u002Fdiv>\n      <div class=\"panel-sub\" data-i18n=\"daily_sub\">养成系，每天重置<\u002Fdiv>\n      <div class=\"task-list\" id=\"dailyList\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"view\" id=\"view-shop\">\n    <div class=\"tasks-header\">\n      <div class=\"section-title\">\n        <span data-i18n=\"wish_shop\">许愿商店<\u002Fspan>\n        <span class=\"sub\" data-i18n=\"wish_shop_sub\">用星星换你真正想要的<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size: 20px; font-weight: 600; color: var(--peach-deep); font-family: 'Fraunces', serif;\">\n        ✨ <span id=\"shopStars\">0<\u002Fspan> <span data-i18n=\"stars_unit\">颗星<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"insight-card\" style=\"margin-bottom: 20px;\">\n      <span class=\"quote-mark\">\"<\u002Fspan>\n      <span data-i18n=\"shop_intro\">这里的奖励都是你平时\"偷懒\"会做或者\"犹豫太久\"不敢做的事。兑换它们不是放纵，是<b>给努力一个正当的出口<\u002Fb>。 用星星换取后，请无罪恶感地享受 🌷<\u002Fspan>\n      <button class=\"btn btn-ghost\" data-i18n=\"add_reward\" style=\"margin-top: 12px; padding: 6px 12px; font-size: 13px;\" onclick=\"openShopEditModal()\">+ 添加我想要的奖励<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"shop-grid\" id=\"shopGrid\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"view\" id=\"view-cards\">\n    <div class=\"section-title\">\n      <span data-i18n=\"cards_title\">卡片收藏册<\u002Fspan>\n      <span class=\"sub\" data-i18n=\"cards_sub\">完成任务有机率掉落 · 稀有卡让人更有力量<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin: 16px 0 20px; display: flex; gap: 10px; flex-wrap: wrap;\">\n      <button class=\"quick-btn\" data-i18n=\"f_all\" onclick=\"filterCards('all')\">全部<\u002Fbutton>\n      <button class=\"quick-btn\" data-i18n=\"dim_career\" onclick=\"filterCards('career')\">💼 事业<\u002Fbutton>\n      <button class=\"quick-btn\" data-i18n=\"dim_charm\" onclick=\"filterCards('charm')\">💖 魅力<\u002Fbutton>\n      <button class=\"quick-btn\" data-i18n=\"dim_wealth\" onclick=\"filterCards('wealth')\">💰 财富<\u002Fbutton>\n      <button class=\"quick-btn\" data-i18n=\"dim_wisdom\" onclick=\"filterCards('wisdom')\">📚 智慧<\u002Fbutton>\n      <button class=\"quick-btn\" data-i18n=\"dim_health\" onclick=\"filterCards('health')\">🌿 健康<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"cards-grid\" id=\"cardsGrid\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"view\" id=\"view-focus\">\n    <div class=\"section-title\">\n      <span data-i18n=\"focus_title\">专注模式<\u002Fspan>\n      <span class=\"sub\" data-i18n=\"focus_sub\">坐下 5 分钟就能开始 · 启动比完成更重要<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"panel\" style=\"margin-top: 20px; text-align: center;\">\n      <div class=\"timer-display\">\n        <div class=\"timer-time\" id=\"timerTime\">25:00<\u002Fdiv>\n        <div class=\"timer-label\" id=\"timerLabel\" data-i18n=\"timer_idle\">准备一段温柔的专注<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"form-group\" style=\"max-width: 400px; margin: 0 auto 16px;\">\n        <label data-i18n=\"focus_what\">这次想专注做什么？<\u002Flabel>\n        <input id=\"focusTaskName\" data-i18n-ph=\"focus_what_ph\" placeholder=\"例如：读《悉达多》第 3 章\">\n      <\u002Fdiv>\n\n      <div class=\"form-group\" style=\"max-width: 400px; margin: 0 auto 20px;\">\n        <label data-i18n=\"focus_duration\">时长<\u002Flabel>\n        <select id=\"focusDuration\">\n          <option value=\"5\" data-i18n=\"f_5\">5 分钟（仅启动奖励）<\u002Foption>\n          <option value=\"15\" data-i18n=\"f_15\">15 分钟<\u002Foption>\n          <option value=\"25\" selected=\"\" data-i18n=\"f_25\">25 分钟 · 番茄<\u002Foption>\n          <option value=\"45\" data-i18n=\"f_45\">45 分钟 · 深度<\u002Foption>\n          <option value=\"60\" data-i18n=\"f_60\">60 分钟 · 沉浸<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 10px; max-width: 400px; margin: 0 auto;\">\n        <button class=\"btn btn-primary\" data-i18n=\"f_start\" id=\"focusStartBtn\" onclick=\"startFocus()\">开始 ▸<\u002Fbutton>\n        <button class=\"btn btn-ghost\" data-i18n=\"f_give_up\" id=\"focusStopBtn\" onclick=\"stopFocus(false)\" style=\"display:none;\">放弃<\u002Fbutton>\n        <button class=\"btn btn-warm\" data-i18n=\"f_done\" id=\"focusDoneBtn\" onclick=\"stopFocus(true)\" style=\"display:none;\">完成 ✓<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"insight-card\" style=\"margin-top: 20px; text-align: left;\">\n        <span class=\"quote-mark\">\"<\u002Fspan>\n        <span data-i18n=\"focus_blurb\">启动是最难的。所以只要你开始了 <b>5 分钟<\u002Fb>，就能拿到一半积分——即使中途放弃也算。完成全程再拿另一半。<\u002Fspan>\n        <span class=\"pet-name-inline\"><\u002Fspan><span data-i18n=\"focus_blurb2\">最喜欢看你勇敢地坐下来那一刻。<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"view\" id=\"view-insights\">\n    <div class=\"section-title\">\n      <span data-i18n=\"log_title\">心情与记录<\u002Fspan>\n      <span class=\"sub\" data-i18n=\"log_sub\">温柔地看看自己走过的路<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"panel\" style=\"margin-top: 20px;\">\n      <div class=\"panel-title\" data-i18n=\"today_words\">今日一言<\u002Fdiv>\n      <div class=\"form-group\">\n        <textarea id=\"journalInput\" rows=\"3\" data-i18n-ph=\"today_words_ph\" placeholder=\"今天的一个小发现、一个小感受...\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <button class=\"btn btn-primary\" data-i18n=\"save_journal\" onclick=\"saveJournal()\" style=\"max-width: 200px;\">记下来 ✎<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"panel\" style=\"margin-top: 20px;\">\n      <div class=\"panel-title\" data-i18n=\"last_7\">最近 7 天<\u002Fdiv>\n      <div id=\"weekChart\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"panel\" style=\"margin-top: 20px;\" id=\"moodPanel\">\n      <div class=\"panel-title\" id=\"moodPanelTitle\">今日心情 · 选一个关键词<\u002Fdiv>\n      <div id=\"moodChips\" style=\"display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;\"><\u002Fdiv>\n      <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n        <input id=\"moodCustomInput\" type=\"text\" placeholder=\"自由添加一个心情词...\" style=\"flex:1; min-width:180px; padding:8px 12px; border:1.5px solid var(--cream-2); border-radius: 12px; font-family:inherit; background: var(--cream); color: var(--ink);\">\n        <button class=\"btn btn-primary\" onclick=\"addCustomMood()\" style=\"max-width: 160px;\" id=\"moodAddBtn\">添加并记录<\u002Fbutton>\n      <\u002Fdiv>\n      <div id=\"moodTodayTags\" style=\"margin-top:12px; min-height:24px;\"><\u002Fdiv>\n\n      <div style=\"display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;\">\n        <button class=\"btn\" onclick=\"setMoodRange('week')\" id=\"mrWeek\" style=\"background: var(--cream-2);\">周<\u002Fbutton>\n        <button class=\"btn\" onclick=\"setMoodRange('month')\" id=\"mrMonth\" style=\"background: var(--cream-2);\">月<\u002Fbutton>\n        <button class=\"btn\" onclick=\"setMoodRange('year')\" id=\"mrYear\" style=\"background: var(--cream-2);\">年<\u002Fbutton>\n        <div id=\"moodRangeHint\" style=\"margin-left:auto; color: var(--ink-soft); font-size:13px; align-self:center;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"moodStats\" style=\"margin-top:12px;\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"panel\" style=\"margin-top: 20px;\">\n      <div class=\"panel-title\" data-i18n=\"past_notes\">写过的话<\u002Fdiv>\n      <div id=\"journalList\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"panel\" style=\"margin-top: 20px;\">\n      <div class=\"panel-title\" data-i18n=\"data\">数据<\u002Fdiv>\n      <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n        <button class=\"quick-btn\" data-i18n=\"export\" onclick=\"exportData()\">📥 导出数据<\u002Fbutton>\n        <button class=\"quick-btn\" data-i18n=\"import\" onclick=\"importData()\">📤 导入数据<\u002Fbutton>\n        <button class=\"quick-btn\" data-i18n=\"reset\" onclick=\"resetData()\" style=\"color: #c88585;\">🗑 全部重置<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<button class=\"comfort-btn\" onclick=\"todayNotOK()\"><span style=\"font-size:18px; line-height:1;\">☹️<\u002Fspan><span data-i18n=\"comfort\" id=\"comfortBtnText\">今天有点不行<\u002Fspan><\u002Fbutton>\n\n<div class=\"toast-container\" id=\"toastContainer\"><\u002Fdiv>\n\n<div class=\"modal-overlay\" id=\"comfortModal\">\n  <div class=\"modal\" style=\"text-align:center; max-width:420px;\">\n    <div id=\"comfortSeed\" style=\"margin: 8px auto 6px; width:160px; height:160px; display:flex; align-items:center; justify-content:center;\"><\u002Fdiv>\n    <div id=\"comfortSparkles\" style=\"position:relative; height:0; overflow:visible;\"><\u002Fdiv>\n    <h3 id=\"comfortTitle\" style=\"margin: 4px 0 10px; color: var(--ink); font-family: 'Caveat', cursive; font-size: 30px; font-weight:600;\"><\u002Fh3>\n    <p id=\"comfortBody\" style=\"color: var(--ink-soft); font-size: 15px; line-height: 1.7; margin: 0 0 20px; padding: 0 6px;\"><\u002Fp>\n    <div style=\"display:flex; gap:10px; justify-content:center; flex-wrap:wrap;\">\n      <button id=\"comfortHugBtn\" style=\"background: var(--rose, #c9584a); color:#fff; border:none; border-radius:999px; padding:10px 22px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 3px 0 var(--peach-deep, #8e3a30);\"><\u002Fbutton>\n      <button id=\"comfortCloseBtn\" style=\"background: transparent; color: var(--ink-soft); border:1.5px solid var(--ink-soft); border-radius:999px; padding:10px 22px; font-family:inherit; font-size:14px; cursor:pointer;\"><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"modal-overlay\" id=\"taskModal\">\n  <div class=\"modal\">\n    <h3 id=\"taskModalTitle\" data-i18n=\"new_task_h\">新任务<\u002Fh3>\n    <div class=\"form-group\">\n      <label data-i18n=\"task_name\">任务名称<\u002Flabel>\n      <input id=\"taskNameInput\" data-i18n-ph=\"task_name_ph\" placeholder=\"例如：读书 30 分钟\">\n    <\u002Fdiv>\n    <div class=\"form-group\">\n      <label data-i18n=\"task_dim\">所属维度（决定加哪项能力）<\u002Flabel>\n      <select id=\"taskDimInput\">\n        <option value=\"career\" data-i18n=\"dim_career\">💼 事业<\u002Foption>\n        <option value=\"charm\" data-i18n=\"dim_charm\">💖 魅力<\u002Foption>\n        <option value=\"wealth\" data-i18n=\"dim_wealth\">💰 财富<\u002Foption>\n        <option value=\"wisdom\" data-i18n=\"dim_wisdom\">📚 智慧<\u002Foption>\n        <option value=\"health\" data-i18n=\"dim_health\">🌿 健康<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"form-row\">\n      <div class=\"form-group\">\n        <label data-i18n=\"task_diff\">难度（决定奖励）<\u002Flabel>\n        <select id=\"taskDifficultyInput\">\n          <option value=\"1\" data-i18n=\"d1\">🌱 小事 (+5)<\u002Foption>\n          <option value=\"2\" selected=\"\" data-i18n=\"d2\">🌿 一般 (+15)<\u002Foption>\n          <option value=\"3\" data-i18n=\"d3\">🌳 挑战 (+30)<\u002Foption>\n          <option value=\"4\" data-i18n=\"d4\">🌲 大事 (+60)<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"form-group\">\n        <label data-i18n=\"task_type\">类型<\u002Flabel>\n        <select id=\"taskTypeInput\">\n          <option value=\"daily\" data-i18n=\"daily_short\">每日<\u002Foption>\n          <option value=\"once\" data-i18n=\"once_short\">一次性<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-actions\">\n      <button class=\"btn btn-ghost\" data-i18n=\"cancel\" onclick=\"closeTaskModal()\">取消<\u002Fbutton>\n      <button class=\"btn btn-primary\" data-i18n=\"save\" id=\"saveTaskBtn\" onclick=\"saveTask()\">保存<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"modal-overlay\" id=\"shopModal\">\n  <div class=\"modal\">\n    <h3 data-i18n=\"add_reward_h\">添加我想要的奖励<\u002Fh3>\n    <p style=\"color: var(--ink-soft); margin-bottom: 16px; font-size: 14px;\" data-i18n=\"add_reward_intro\">\n      写下你平时会\"偷懒\"的事，或者一直舍不得花时间的事 🌷\n    <\u002Fp>\n    <div class=\"form-group\">\n      <label data-i18n=\"reward_name\">奖励名字<\u002Flabel>\n      <input id=\"shopNameInput\" data-i18n-ph=\"reward_name_ph\" placeholder=\"例如：看一集喜欢的剧\">\n    <\u002Fdiv>\n    <div class=\"form-group\">\n      <label data-i18n=\"reward_icon\">图标（一个 emoji）<\u002Flabel>\n      <input id=\"shopIconInput\" placeholder=\"🎬\" maxlength=\"4\">\n    <\u002Fdiv>\n    <div class=\"form-row\">\n      <div class=\"form-group\">\n        <label data-i18n=\"reward_price\">需要星星<\u002Flabel>\n        <input id=\"shopPriceInput\" type=\"number\" value=\"50\" min=\"1\">\n      <\u002Fdiv>\n      <div class=\"form-group\">\n        <label data-i18n=\"reward_limit\">每天最多兑换<\u002Flabel>\n        <select id=\"shopLimitInput\">\n          <option value=\"0\" data-i18n=\"unlimited\">不限<\u002Foption>\n          <option value=\"1\" selected=\"\" data-i18n=\"l1\">1 次<\u002Foption>\n          <option value=\"2\" data-i18n=\"l2\">2 次<\u002Foption>\n          <option value=\"3\" data-i18n=\"l3\">3 次<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-group\">\n      <label data-i18n=\"reward_desc\">描述（可选）<\u002Flabel>\n      <input id=\"shopDescInput\" data-i18n-ph=\"reward_desc_ph\" placeholder=\"给未来的自己一句话\">\n    <\u002Fdiv>\n    <div class=\"modal-actions\">\n      <button class=\"btn btn-ghost\" data-i18n=\"cancel\" onclick=\"closeShopModal()\">取消<\u002Fbutton>\n      <button class=\"btn btn-primary\" data-i18n=\"save\" onclick=\"saveShopItem()\">保存<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst LS_KEY = 'habit_garden_v1';\nconst todayStr = () => new Date().toISOString().slice(0,10);\n\nlet state = {\n  pet: { name: '毛豆', xp: 0, stage: 0, species: null, harvest: [], lastHarvestXp: 0, lastHarvestDate: null },\n  stars: 0, streak: 0, lastActiveDate: null,\n  dims: { career: 0, charm: 0, wealth: 0, wisdom: 0, health: 0 },\n  tasks: [], completions: {}, shopItems: [], shopPurchases: {},\n  cards: {}, sleep: {}, journal: [], moods: {}, customMoods: [], settings: { seenWelcome: false, seedOpened: false }\n};\n\n/* ============ Pet species (blind-box) ============ */\nconst PET_SPECIES = {\n  edamame: { zhName:'毛豆', enName:'Edamame', harvestZh:'豆荚', harvestEn:'pod', harvestEmoji:'🫛' },\n  rose:    { zhName:'玫瑰', enName:'Rose',    harvestZh:'玫瑰花',harvestEn:'rose', harvestEmoji:'🌹' },\n  tomato:  { zhName:'番茄', enName:'Tomato',  harvestZh:'番茄', harvestEn:'tomato', harvestEmoji:'🍅' },\n  cactus:  { zhName:'仙人掌', enName:'Cactus',harvestZh:'仙人掌花',harvestEn:'cactus flower', harvestEmoji:'🌸' },\n  monstera:{ zhName:'龟背竹', enName:'Monstera',harvestZh:'大叶片',harvestEn:'big leaf', harvestEmoji:'🌿' },\n};\nconst SPECIES_KEYS = Object.keys(PET_SPECIES);\nfunction getSpecies(){ return state.pet.species && PET_SPECIES[state.pet.species] ? state.pet.species : 'edamame'; }\nfunction speciesInfo(){ return PET_SPECIES[getSpecies()]; }\n\nfunction openBlindBox(){\n  const k = SPECIES_KEYS[Math.floor(Math.random()*SPECIES_KEYS.length)];\n  state.pet.species = k;\n  const info = PET_SPECIES[k];\n  // Rename pet to species name if still default\n  state.pet.name = getLang()==='en' ? info.enName : info.zhName;\n  state.settings.seedOpened = true;\n  save();\n  renderAll();\n  toast(T(`拆开盲盒，掉落了一颗【${info.zhName}】种子！🌱`, `Blind box opened — a 【${info.enName}】 seed fell out! 🌱`), '🎁');\n}\n\nfunction save() {\n  localStorage.setItem(LS_KEY, JSON.stringify(state));\n}\n\nfunction load() {\n  const raw = localStorage.getItem(LS_KEY);\n  if (raw) {\n    try { state = { ...state, ...JSON.parse(raw) }; } catch(e) {}\n  }\n  handleDayRoll();\n}\n\nfunction handleDayRoll() {\n  const t = todayStr();\n  if (state.lastActiveDate && state.lastActiveDate !== t) {\n    const last = new Date(state.lastActiveDate);\n    const now = new Date(t);\n    const diff = (now - last) / 86400000;\n    if (diff > 1.5) state.streak = 0;\n    // New-day harvest drop\n    ensurePetFields();\n    if (state.pet.harvest && state.pet.harvest.length > 0) dropHarvestForNewDay();\n  }\n  state.lastActiveDate = t;\n  save();\n}\n\nfunction seedDefaults() {\n  if (state.tasks.length === 0) {\n    state.tasks = [\n      { id: uid(), name: '读书 30 分钟', dim: 'wisdom', difficulty: 2, type: 'daily', createdAt: Date.now() },\n      { id: uid(), name: '练琴 30 分钟', dim: 'charm', difficulty: 2, type: 'daily', createdAt: Date.now() },\n      { id: uid(), name: '写日记', dim: 'wisdom', difficulty: 1, type: 'daily', createdAt: Date.now() },\n      { id: uid(), name: '早睡（23点前）', dim: 'health', difficulty: 2, type: 'daily', createdAt: Date.now() },\n      { id: uid(), name: '按时吃药/喝水', dim: 'health', difficulty: 1, type: 'daily', createdAt: Date.now() },\n      { id: uid(), name: '写一篇文章', dim: 'career', difficulty: 3, type: 'once', createdAt: Date.now() },\n    ];\n  }\n  if (state.shopItems.length === 0) {\n    state.shopItems = [\n      { id: uid(), name: '看一集剧', icon: '🎬', price: 50, limit: 1, desc: '无罪恶感地追剧' },\n      { id: uid(), name: '玩 1 小时电脑游戏', icon: '🎮', price: 80, limit: 1, desc: '大脑也需要多巴胺' },\n      { id: uid(), name: '去逛街', icon: '🛍', price: 150, limit: 0, desc: '看看世界，换换心情' },\n      { id: uid(), name: '听一场音乐会', icon: '🎵', price: 300, limit: 0, desc: '给灵魂一次洗澡' },\n      { id: uid(), name: '叫一份想吃的外卖', icon: '🍜', price: 100, limit: 1, desc: '今天辛苦啦' },\n      { id: uid(), name: '赖床 30 分钟', icon: '🛏', price: 60, limit: 1, desc: '偶尔放纵一下' },\n      { id: uid(), name: '整天自由日', icon: '🌈', price: 500, limit: 0, desc: '什么都不用做的完整一天' },\n    ];\n  }\n  save();\n}\n\nfunction uid() { return Math.random().toString(36).slice(2,10); }\n\nconst CARD_POOL = [\n  // ===== CAREER 事业 (mushrooms / forest workers) =====\n  { id:'ca1', dim:'career', name:'菇菇打工人', icon:'🍄', rarity:'common' },\n  { id:'ca2', dim:'career', name:'小蒲公英',   icon:'🌼', rarity:'common' },\n  { id:'ca3', dim:'career', name:'向上藤蔓',   icon:'🌱', rarity:'common' },\n  { id:'ca4', dim:'career', name:'晨露三叶草', icon:'🍀', rarity:'common' },\n  { id:'ca5', dim:'career', name:'笔记松果',   icon:'🌰', rarity:'common' },\n  { id:'ca6', dim:'career', name:'专注多肉',   icon:'🌵', rarity:'rare' },\n  { id:'ca7', dim:'career', name:'竹节先生',   icon:'🎋', rarity:'rare' },\n  { id:'ca8', dim:'career', name:'向日葵领队', icon:'🌻', rarity:'rare' },\n  { id:'ca9', dim:'career', name:'黎明蕨',     icon:'🌿', rarity:'rare' },\n  { id:'ca10',dim:'career', name:'槲寄生参谋', icon:'🍃', rarity:'epic' },\n  { id:'ca11',dim:'career', name:'橡树总监',   icon:'🌳', rarity:'epic' },\n  { id:'ca12',dim:'career', name:'星月金桂',   icon:'🌟', rarity:'epic' },\n  { id:'ca13',dim:'career', name:'世界之树',   icon:'🌲', rarity:'legendary' },\n\n  // ===== CHARM 魅力 (flowers) =====\n  { id:'ch1', dim:'charm',  name:'小樱花',     icon:'🌸', rarity:'common' },\n  { id:'ch2', dim:'charm',  name:'薄荷女孩',   icon:'🌿', rarity:'common' },\n  { id:'ch3', dim:'charm',  name:'粉铃兰',     icon:'💮', rarity:'common' },\n  { id:'ch4', dim:'charm',  name:'小雏菊',     icon:'🌼', rarity:'common' },\n  { id:'ch5', dim:'charm',  name:'含羞草',     icon:'🍃', rarity:'common' },\n  { id:'ch6', dim:'charm',  name:'玫瑰夫人',   icon:'🌹', rarity:'rare' },\n  { id:'ch7', dim:'charm',  name:'郁金香舞者', icon:'🌷', rarity:'rare' },\n  { id:'ch8', dim:'charm',  name:'芙蓉少女',   icon:'🌺', rarity:'rare' },\n  { id:'ch9', dim:'charm',  name:'木兰姑娘',   icon:'🪷', rarity:'rare' },\n  { id:'ch10',dim:'charm',  name:'夜樱花魂',   icon:'🎐', rarity:'epic' },\n  { id:'ch11',dim:'charm',  name:'月见草',     icon:'🌙', rarity:'epic' },\n  { id:'ch12',dim:'charm',  name:'紫藤仙子',   icon:'💜', rarity:'epic' },\n  { id:'ch13',dim:'charm',  name:'彼岸花神',   icon:'🕊', rarity:'legendary' },\n\n  // ===== WEALTH 财富 (fruits / golden plants) =====\n  { id:'we1', dim:'wealth', name:'小金豆',     icon:'🫘', rarity:'common' },\n  { id:'we2', dim:'wealth', name:'小草莓',     icon:'🍓', rarity:'common' },\n  { id:'we3', dim:'wealth', name:'青苹果',     icon:'🍏', rarity:'common' },\n  { id:'we4', dim:'wealth', name:'金桔郎',     icon:'🍊', rarity:'common' },\n  { id:'we5', dim:'wealth', name:'幸运葡萄',   icon:'🍇', rarity:'common' },\n  { id:'we6', dim:'wealth', name:'蜜桃小姐',   icon:'🍑', rarity:'rare' },\n  { id:'we7', dim:'wealth', name:'石榴将军',   icon:'🟥', rarity:'rare' },\n  { id:'we8', dim:'wealth', name:'金穗稻',     icon:'🌾', rarity:'rare' },\n  { id:'we9', dim:'wealth', name:'丰收南瓜',   icon:'🎃', rarity:'rare' },\n  { id:'we10',dim:'wealth', name:'菠萝爵士',   icon:'🍍', rarity:'epic' },\n  { id:'we11',dim:'wealth', name:'琥珀无花果', icon:'🟫', rarity:'epic' },\n  { id:'we12',dim:'wealth', name:'金枝桂花',   icon:'💛', rarity:'epic' },\n  { id:'we13',dim:'wealth', name:'摇钱橄榄树', icon:'🫒', rarity:'legendary' },\n\n  // ===== WISDOM 智慧 (herbs / forest sages) =====\n  { id:'wi1', dim:'wisdom', name:'书签苔藓',   icon:'🌿', rarity:'common' },\n  { id:'wi2', dim:'wisdom', name:'柠檬草',     icon:'🍋', rarity:'common' },\n  { id:'wi3', dim:'wisdom', name:'薰衣草童',   icon:'💐', rarity:'common' },\n  { id:'wi4', dim:'wisdom', name:'鼠尾草',     icon:'🌱', rarity:'common' },\n  { id:'wi5', dim:'wisdom', name:'蒲公英信使', icon:'🍃', rarity:'common' },\n  { id:'wi6', dim:'wisdom', name:'迷迭香学者', icon:'📜', rarity:'rare' },\n  { id:'wi7', dim:'wisdom', name:'紫苏老师',   icon:'🍶', rarity:'rare' },\n  { id:'wi8', dim:'wisdom', name:'人参小童',   icon:'🫚', rarity:'rare' },\n  { id:'wi9', dim:'wisdom', name:'月桂诗人',   icon:'🏛', rarity:'rare' },\n  { id:'wi10',dim:'wisdom', name:'千年古柏',   icon:'🌲', rarity:'epic' },\n  { id:'wi11',dim:'wisdom', name:'银杏老者',   icon:'🍂', rarity:'epic' },\n  { id:'wi12',dim:'wisdom', name:'梅花隐士',   icon:'🌸', rarity:'epic' },\n  { id:'wi13',dim:'wisdom', name:'七叶灵草',   icon:'☯', rarity:'legendary' },\n\n  // ===== HEALTH 健康 (lotus / healing plants) =====\n  { id:'he1', dim:'health', name:'小莲蓬',     icon:'🪷', rarity:'common' },\n  { id:'he2', dim:'health', name:'竹笋宝宝',   icon:'🎋', rarity:'common' },\n  { id:'he3', dim:'health', name:'艾草小精灵', icon:'🌿', rarity:'common' },\n  { id:'he4', dim:'health', name:'菠菜弟',     icon:'🥬', rarity:'common' },\n  { id:'he5', dim:'health', name:'胡萝卜小子', icon:'🥕', rarity:'common' },\n  { id:'he6', dim:'health', name:'莴苣守卫',   icon:'🥗', rarity:'rare' },\n  { id:'he7', dim:'health', name:'芦荟医师',   icon:'🌵', rarity:'rare' },\n  { id:'he8', dim:'health', name:'甘菊护士',   icon:'🌼', rarity:'rare' },\n  { id:'he9', dim:'health', name:'番茄先生',   icon:'🍅', rarity:'rare' },\n  { id:'he10',dim:'health', name:'睡莲公主',   icon:'🌙', rarity:'epic' },\n  { id:'he11',dim:'health', name:'灵芝仙翁',   icon:'🍄', rarity:'epic' },\n  { id:'he12',dim:'health', name:'金莲之心',   icon:'💠', rarity:'epic' },\n  { id:'he13',dim:'health', name:'不老仙草',   icon:'🌟', rarity:'legendary' },\n];\n\nconst CARD_NAMES_EN = {\n  // Career\n  ca1:'Mushroom Worker', ca2:'Little Dandelion', ca3:'Climbing Vine', ca4:'Dewdrop Clover', ca5:'Notebook Pinecone',\n  ca6:'Focus Succulent', ca7:'Mr. Bamboo', ca8:'Sunflower Captain', ca9:'Dawn Fern',\n  ca10:'Mistletoe Advisor', ca11:'Director Oak', ca12:'Star Osmanthus',\n  ca13:'World Tree',\n  // Charm\n  ch1:'Little Cherry Blossom', ch2:'Mint Girl', ch3:'Pink Lily of the Valley', ch4:'Tiny Daisy', ch5:'Mimosa',\n  ch6:'Lady Rose', ch7:'Tulip Dancer', ch8:'Hibiscus Maiden', ch9:'Magnolia Girl',\n  ch10:'Night Sakura Spirit', ch11:'Evening Primrose', ch12:'Wisteria Fairy',\n  ch13:'Spider Lily Goddess',\n  // Wealth\n  we1:'Little Goldbean', we2:'Strawberry', we3:'Green Apple', we4:'Sir Kumquat', we5:'Lucky Grape',\n  we6:'Miss Peach', we7:'General Pomegranate', we8:'Golden Rice Stalk', we9:'Harvest Pumpkin',\n  we10:'Sir Pineapple', we11:'Amber Fig', we12:'Golden Osmanthus',\n  we13:'Money-Tree Olive',\n  // Wisdom\n  wi1:'Bookmark Moss', wi2:'Lemongrass', wi3:'Lavender Child', wi4:'Sage Sprout', wi5:'Dandelion Messenger',\n  wi6:'Rosemary Scholar', wi7:'Teacher Perilla', wi8:'Ginseng Boy', wi9:'Laurel Poet',\n  wi10:'Ancient Cypress', wi11:'Elder Ginkgo', wi12:'Plum Hermit',\n  wi13:'Seven-Leaf Spirit Herb',\n  // Health\n  he1:'Little Lotus Pod', he2:'Bamboo Shoot Baby', he3:'Mugwort Sprite', he4:'Spinach Bro', he5:'Carrot Kid',\n  he6:'Lettuce Guardian', he7:'Doctor Aloe', he8:'Nurse Chamomile', he9:'Mr. Tomato',\n  he10:'Water Lily Princess', he11:'Lingzhi Sage', he12:'Golden Lotus Heart',\n  he13:'Eternal Spirit Herb',\n};\nfunction getCardName(c){ return getLang()==='en' ? (CARD_NAMES_EN[c.id] || c.name) : c.name; }\n\nfunction maybeDropCard(difficulty) {\n  const dropChance = [0.15, 0.3, 0.5, 0.7][difficulty - 1] || 0.2;\n  if (Math.random() > dropChance) return null;\n  const rarityRoll = Math.random();\n  let rarity = 'common';\n  const bonus = (difficulty - 1) * 0.1;\n  if (rarityRoll > 0.95 - bonus) rarity = 'legendary';\n  else if (rarityRoll > 0.85 - bonus) rarity = 'epic';\n  else if (rarityRoll > 0.6 - bonus) rarity = 'rare';\n  const candidates = CARD_POOL.filter(c => c.rarity === rarity);\n  const card = candidates[Math.floor(Math.random() * candidates.length)];\n  if (!card) return null;\n  state.cards[card.id] = (state.cards[card.id] || 0) + 1;\n  return card;\n}\n\nconst PET_STAGES = [\n  { name: '小种子', nameEn: 'Tiny Seed', minXp: 0 },\n  { name: '萌芽期', nameEn: 'Sprout', minXp: 50 },\n  { name: '小芽豆', nameEn: 'Little Bean', minXp: 150 },\n  { name: '青青豆', nameEn: 'Green Bean', minXp: 400 },\n  { name: '圆滚豆', nameEn: 'Round Bean', minXp: 800 },\n  { name: '星辰豆', nameEn: 'Starry Bean', minXp: 1500 },\n];\nfunction getPetStageName(i){ const s = PET_STAGES[i]; return getLang()==='en' ? (s.nameEn || s.name) : s.name; }\n\nfunction getPetStage() {\n  let idx = 0;\n  for (let i = 0; i < PET_STAGES.length; i++) {\n    if (state.pet.xp >= PET_STAGES[i].minXp) idx = i;\n  }\n  return idx;\n}\n\n/* ============ Plant drawing (species + stage + harvest) ============\n   stageIdx 0..5 maps to: seed(0) / sprout(1) / young(2) / teen(3) / bud(4) / mature(5)\n   mature stage also draws `harvestCount` extra fruits/flowers/leaves from state.pet.harvest. */\nfunction getPetSvg(stageIdx, mood = 'happy') {\n  // If blind box hasn't been opened yet, draw the mystery gift box.\n  if (!state.settings.seedOpened) return drawMysteryBox();\n  const species = getSpecies();\n  const W = 240, H = 240;\n  const harvestCount = (state.pet.harvest || []).length;\n  const mouthPath = mood === 'sad'\n    ? `M ${W/2 - 6} 170 Q ${W/2} 165 ${W/2 + 6} 170`\n    : mood === 'neutral'\n    ? `M ${W/2 - 6} 172 L ${W/2 + 6} 172`\n    : `M ${W/2 - 8} 168 Q ${W/2} 176 ${W/2 + 8} 168`;\n  const eyeR = mood === 'sad' ? 2 : 2.5;\n\n  // Terracotta pot (shared across species)\n  const pot = `\n    <path d=\"M 70 205 L 80 255 L 160 255 L 170 205 Z\" fill=\"#c78a5a\" stroke=\"#a66d42\" stroke-width=\"2\"/>\n    <rect x=\"66\" y=\"196\" width=\"108\" height=\"14\" rx=\"3\" fill=\"#a66d42\"/>\n    <ellipse cx=\"120\" cy=\"205\" rx=\"48\" ry=\"6\" fill=\"#8a5835\" opacity=\"0.5\"/>\n  `;\n  // Soil mound\n  const soil = stageIdx >= 1 ? `<ellipse cx=\"120\" cy=\"202\" rx=\"42\" ry=\"5\" fill=\"#6b4a2e\"/>` : '';\n\n  let body = '';\n  if (stageIdx === 0) {\n    body = drawSeed(species, mood);\n  } else {\n    body = {\n      edamame: drawEdamame,\n      rose: drawRose,\n      tomato: drawTomato,\n      cactus: drawCactus,\n      monstera: drawMonstera,\n    }[species](stageIdx, harvestCount);\n  }\n  // Face — draw on the main body mass (species-placed)\n  const face = stageIdx === 0 ? '' : drawFace(species, stageIdx, mouthPath, eyeR);\n\n  return `<svg width=\"${W}\" height=\"${H}\" viewBox=\"0 0 ${W} ${H}\" xmlns=\"http://www.w3.org/2000/svg\">\n    ${pot}\n    ${soil}\n    ${body}\n    ${face}\n  <\u002Fsvg>`;\n}\n\nfunction drawMysteryBox(){\n  return `<svg width=\"240\" height=\"240\" viewBox=\"0 0 240 240\" xmlns=\"http://www.w3.org/2000/svg\">\n    <rect x=\"60\" y=\"90\" width=\"120\" height=\"100\" rx=\"8\" fill=\"#e8b896\" stroke=\"#b4805a\" stroke-width=\"2.5\"/>\n    <rect x=\"50\" y=\"78\" width=\"140\" height=\"22\" rx=\"5\" fill=\"#d69876\" stroke=\"#b4805a\" stroke-width=\"2.5\"/>\n    <rect x=\"113\" y=\"80\" width=\"14\" height=\"110\" fill=\"#c9584a\"/>\n    <path d=\"M 120 80 Q 100 50 85 62 Q 78 72 100 82 Q 115 80 120 80 Q 125 80 140 82 Q 162 72 155 62 Q 140 50 120 80 Z\" fill=\"#c9584a\" stroke=\"#8e3a30\" stroke-width=\"1.5\"/>\n    <circle cx=\"120\" cy=\"80\" r=\"4\" fill=\"#8e3a30\"/>\n    <text x=\"120\" y=\"148\" text-anchor=\"middle\" font-size=\"42\" fill=\"#8e3a30\" font-family=\"serif\" font-weight=\"bold\">?<\u002Ftext>\n    <g opacity=\"0.7\">\n      <circle cx=\"45\" cy=\"60\" r=\"2.5\" fill=\"#f3d388\"/>\n      <circle cx=\"195\" cy=\"50\" r=\"3\" fill=\"#f2a78d\"/>\n      <circle cx=\"205\" cy=\"140\" r=\"2\" fill=\"#a9cbd8\"/>\n      <circle cx=\"40\" cy=\"160\" r=\"2.5\" fill=\"#c4b5d9\"/>\n    <\u002Fg>\n  <\u002Fsvg>`;\n}\n\nfunction drawSeed(species, mood){\n  const seedColor = { edamame:'#c7b186', rose:'#8a5c3a', tomato:'#b38050', cactus:'#9a7c52', monstera:'#7c6142' }[species] || '#a88868';\n  // Big, round seed so we can fit a face on it.\n  const cx = 120, cy = 195;\n  const rx = 26, ry = 20;\n  const eyeR = mood === 'sad' ? 2.2 : 2.8;\n  const mouth = mood === 'sad'\n    ? `M ${cx-6} ${cy+4} Q ${cx} ${cy+1} ${cx+6} ${cy+4}`\n    : mood === 'neutral'\n    ? `M ${cx-6} ${cy+5} L ${cx+6} ${cy+5}`\n    : `M ${cx-7} ${cy+3} Q ${cx} ${cy+9} ${cx+7} ${cy+3}`;\n  return `\n    <ellipse cx=\"${cx}\" cy=\"${cy}\" rx=\"${rx}\" ry=\"${ry}\" fill=\"${seedColor}\" stroke=\"${shade(seedColor,-20)}\" stroke-width=\"2\"/>\n    <path d=\"M ${cx-rx*0.7} ${cy} Q ${cx} ${cy-ry*1.1} ${cx+rx*0.7} ${cy}\" stroke=\"${shade(seedColor,-30)}\" stroke-width=\"1.2\" fill=\"none\" opacity=\"0.6\"/>\n    <ellipse cx=\"${cx-rx*0.35}\" cy=\"${cy-ry*0.4}\" rx=\"${rx*0.22}\" ry=\"${ry*0.22}\" fill=\"white\" opacity=\"0.25\"/>\n    <!-- face -->\n    <circle cx=\"${cx-6}\" cy=\"${cy-3}\" r=\"${eyeR}\" fill=\"#3d3527\"/>\n    <circle cx=\"${cx+6}\" cy=\"${cy-3}\" r=\"${eyeR}\" fill=\"#3d3527\"/>\n    <circle cx=\"${cx-5.5}\" cy=\"${cy-3.5}\" r=\"0.8\" fill=\"white\"/>\n    <circle cx=\"${cx+6.5}\" cy=\"${cy-3.5}\" r=\"0.8\" fill=\"white\"/>\n    <path d=\"${mouth}\" stroke=\"#3d3527\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/>\n    <circle cx=\"${cx-12}\" cy=\"${cy+1}\" r=\"2.2\" fill=\"#f2a78d\" opacity=\"0.55\"/>\n    <circle cx=\"${cx+12}\" cy=\"${cy+1}\" r=\"2.2\" fill=\"#f2a78d\" opacity=\"0.55\"/>\n  `;\n}\n\nfunction drawFace(species, stageIdx, mouthPath, eyeR){\n  // Place face on the dominant mass per species and stage.\n  let fx = 120, fy = 160;\n  if (species === 'edamame') { fy = stageIdx === 1 ? 175 : stageIdx === 2 ? 160 : stageIdx === 3 ? 140 : stageIdx === 4 ? 125 : 115; }\n  if (species === 'rose')    { fy = stageIdx === 1 ? 178 : stageIdx === 2 ? 160 : stageIdx === 3 ? 140 : stageIdx === 4 ? 125 : 108; }\n  if (species === 'tomato')  { fy = stageIdx === 1 ? 178 : stageIdx === 2 ? 160 : stageIdx === 3 ? 138 : stageIdx === 4 ? 120 : 112; }\n  if (species === 'cactus')  { fy = stageIdx === 1 ? 178 : stageIdx === 2 ? 158 : stageIdx === 3 ? 140 : stageIdx === 4 ? 130 : 125; }\n  if (species === 'monstera'){ fy = stageIdx === 1 ? 178 : stageIdx === 2 ? 160 : stageIdx === 3 ? 145 : stageIdx === 4 ? 135 : 130; }\n  // Adjust mouth relative coordinates\n  const mp = mouthPath.replace(/170|165|172|168|176/g, (m)=>{\n    const base = { '165': fy-5, '168': fy-2, '170': fy, '172': fy+2, '176': fy+6 }[m] || m;\n    return base;\n  });\n  return `\n    <circle cx=\"${fx-7}\" cy=\"${fy-4}\" r=\"${eyeR}\" fill=\"#3d3527\"/>\n    <circle cx=\"${fx+7}\" cy=\"${fy-4}\" r=\"${eyeR}\" fill=\"#3d3527\"/>\n    <circle cx=\"${fx-6}\" cy=\"${fy-5}\" r=\"0.8\" fill=\"white\"/>\n    <circle cx=\"${fx+8}\" cy=\"${fy-5}\" r=\"0.8\" fill=\"white\"/>\n    <path d=\"${mp}\" stroke=\"#3d3527\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/>\n    <circle cx=\"${fx-14}\" cy=\"${fy+1}\" r=\"2.2\" fill=\"#f2a78d\" opacity=\"0.55\"/>\n    <circle cx=\"${fx+14}\" cy=\"${fy+1}\" r=\"2.2\" fill=\"#f2a78d\" opacity=\"0.55\"/>\n  `;\n}\n\n/* ---- Edamame / 毛豆: rounded pod with beans inside. ---- */\nfunction drawEdamame(stageIdx, harvestCount){\n  const stem = `<path d=\"M 120 ${stageIdx>=2?80:180} Q 118 195 120 202\" stroke=\"#7a9b6e\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>`;\n  if (stageIdx === 1) {\n    // tiny sprout with 2 small leaves\n    return `\n      ${stem.replace('${stageIdx>=2?80:180}','170')}\n      <path d=\"M 120 178 Q 108 170 102 180 Q 112 180 120 178\" fill=\"#9ac670\" stroke=\"#5a8a55\" stroke-width=\"1\"/>\n      <path d=\"M 120 178 Q 132 170 138 180 Q 128 180 120 178\" fill=\"#9ac670\" stroke=\"#5a8a55\" stroke-width=\"1\"/>\n    `;\n  }\n  if (stageIdx === 2) {\n    // more leaves, open\n    return `\n      <path d=\"M 120 160 Q 120 195 120 202\" stroke=\"#7a9b6e\" stroke-width=\"3\" fill=\"none\"/>\n      <ellipse cx=\"102\" cy=\"162\" rx=\"14\" ry=\"8\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(-20 102 162)\"/>\n      <ellipse cx=\"138\" cy=\"162\" rx=\"14\" ry=\"8\" fill=\"#9ac670\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(20 138 162)\"/>\n      <ellipse cx=\"120\" cy=\"150\" rx=\"12\" ry=\"7\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"1.2\"/>\n    `;\n  }\n  if (stageIdx === 3) {\n    // bushy plant, lots of leaves\n    return `\n      <path d=\"M 120 138 Q 120 195 120 202\" stroke=\"#7a9b6e\" stroke-width=\"3.5\" fill=\"none\"/>\n      <ellipse cx=\"92\" cy=\"160\" rx=\"16\" ry=\"9\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(-25 92 160)\"/>\n      <ellipse cx=\"148\" cy=\"160\" rx=\"16\" ry=\"9\" fill=\"#9ac670\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(25 148 160)\"/>\n      <ellipse cx=\"100\" cy=\"140\" rx=\"14\" ry=\"8\" fill=\"#9ac670\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(-15 100 140)\"/>\n      <ellipse cx=\"140\" cy=\"140\" rx=\"14\" ry=\"8\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(15 140 140)\"/>\n      <ellipse cx=\"120\" cy=\"130\" rx=\"14\" ry=\"8\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"1.2\"/>\n    `;\n  }\n  if (stageIdx === 4) {\n    // bud stage — small white flower buds\n    return `\n      <path d=\"M 120 120 Q 120 195 120 202\" stroke=\"#7a9b6e\" stroke-width=\"3.5\" fill=\"none\"/>\n      <ellipse cx=\"88\" cy=\"155\" rx=\"18\" ry=\"10\" fill=\"#9ac670\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(-25 88 155)\"/>\n      <ellipse cx=\"152\" cy=\"155\" rx=\"18\" ry=\"10\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(25 152 155)\"/>\n      <ellipse cx=\"96\" cy=\"135\" rx=\"16\" ry=\"9\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(-15 96 135)\"/>\n      <ellipse cx=\"144\" cy=\"135\" rx=\"16\" ry=\"9\" fill=\"#9ac670\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(15 144 135)\"/>\n      <ellipse cx=\"120\" cy=\"120\" rx=\"16\" ry=\"9\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"1.2\"/>\n      <circle cx=\"100\" cy=\"125\" r=\"4\" fill=\"#fff4e0\" stroke=\"#e8c98a\" stroke-width=\"1\"/>\n      <circle cx=\"140\" cy=\"125\" r=\"4\" fill=\"#fff4e0\" stroke=\"#e8c98a\" stroke-width=\"1\"/>\n      <circle cx=\"120\" cy=\"108\" r=\"4\" fill=\"#fff4e0\" stroke=\"#e8c98a\" stroke-width=\"1\"/>\n    `;\n  }\n  // stage 5: mature — plump pod(s) with visible beans inside\n  const podsBase = 1; // the main pod sits center\n  const extra = harvestCount; // each harvest adds a new pod around the plant\n  const extraPods = Array.from({length: extra}, (_, i) => {\n    const angle = (i / Math.max(1, extra)) * Math.PI * 1.6 - 0.3;\n    const x = 120 + Math.cos(angle) * (48 + (i%2)*6);\n    const y = 130 + Math.sin(angle) * 22 - 10;\n    return edamamePod(x, y, 16 + (angle*6));\n  }).join('');\n  return `\n    <path d=\"M 120 110 Q 120 195 120 202\" stroke=\"#7a9b6e\" stroke-width=\"3.5\" fill=\"none\"/>\n    <ellipse cx=\"82\" cy=\"150\" rx=\"20\" ry=\"11\" fill=\"#9ac670\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(-25 82 150)\"/>\n    <ellipse cx=\"158\" cy=\"150\" rx=\"20\" ry=\"11\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(25 158 150)\"/>\n    <ellipse cx=\"92\" cy=\"130\" rx=\"18\" ry=\"10\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(-15 92 130)\"/>\n    <ellipse cx=\"148\" cy=\"130\" rx=\"18\" ry=\"10\" fill=\"#9ac670\" stroke=\"#5a8a55\" stroke-width=\"1.2\" transform=\"rotate(15 148 130)\"/>\n    <ellipse cx=\"120\" cy=\"115\" rx=\"18\" ry=\"10\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"1.2\"/>\n    ${edamamePod(120, 100, -6)}\n    ${extraPods}\n  `;\n}\nfunction edamamePod(cx, cy, rot){\n  return `<g transform=\"translate(${cx} ${cy}) rotate(${rot})\">\n    <ellipse cx=\"0\" cy=\"0\" rx=\"16\" ry=\"7\" fill=\"#9ac670\" stroke=\"#5a8a55\" stroke-width=\"1.2\"/>\n    <circle cx=\"-7\" cy=\"0\" r=\"3.5\" fill=\"#c6e19a\"/>\n    <circle cx=\"0\" cy=\"0\" r=\"3.5\" fill=\"#c6e19a\"/>\n    <circle cx=\"7\" cy=\"0\" r=\"3.5\" fill=\"#c6e19a\"/>\n  <\u002Fg>`;\n}\n\n/* ---- Rose / 玫瑰: thorny stem, dark green leaves, red bloom ---- */\nfunction drawRose(stageIdx, harvestCount){\n  if (stageIdx === 1) {\n    // sprout with 2 tiny leaves\n    return `\n      <path d=\"M 120 200 L 120 172\" stroke=\"#3a6a38\" stroke-width=\"2.5\" fill=\"none\"/>\n      <path d=\"M 120 178 Q 106 172 100 180 Q 110 182 120 180\" fill=\"#5a8a55\" stroke=\"#3a6a38\" stroke-width=\"1\"/>\n      <path d=\"M 120 178 Q 134 172 140 180 Q 130 182 120 180\" fill=\"#5a8a55\" stroke=\"#3a6a38\" stroke-width=\"1\"/>\n    `;\n  }\n  if (stageIdx === 2) {\n    // serrated leaves, taller stem\n    return `\n      <path d=\"M 120 200 L 120 155\" stroke=\"#3a6a38\" stroke-width=\"3\" fill=\"none\"/>\n      ${roseLeaf(100, 168, -25)}\n      ${roseLeaf(140, 168, 25)}\n      ${roseLeaf(102, 148, -20)}\n      ${roseLeaf(138, 148, 20)}\n    `;\n  }\n  if (stageIdx === 3) {\n    // more leaves + thorns\n    return `\n      <path d=\"M 120 200 L 120 135\" stroke=\"#3a6a38\" stroke-width=\"3.2\" fill=\"none\"/>\n      <path d=\"M 120 180 L 115 175 M 120 165 L 125 160 M 120 150 L 115 145\" stroke=\"#3a6a38\" stroke-width=\"1.5\"/>\n      ${roseLeaf(96, 170, -30)}\n      ${roseLeaf(144, 170, 30)}\n      ${roseLeaf(98, 150, -22)}\n      ${roseLeaf(142, 150, 22)}\n      ${roseLeaf(104, 132, -15)}\n      ${roseLeaf(136, 132, 15)}\n    `;\n  }\n  if (stageIdx === 4) {\n    // closed bud\n    return `\n      <path d=\"M 120 200 L 120 115\" stroke=\"#3a6a38\" stroke-width=\"3.2\" fill=\"none\"/>\n      <path d=\"M 120 180 L 115 175 M 120 160 L 125 155 M 120 140 L 115 135\" stroke=\"#3a6a38\" stroke-width=\"1.5\"/>\n      ${roseLeaf(94, 170, -30)}\n      ${roseLeaf(146, 170, 30)}\n      ${roseLeaf(96, 150, -22)}\n      ${roseLeaf(144, 150, 22)}\n      ${roseLeaf(104, 130, -15)}\n      ${roseLeaf(136, 130, 15)}\n      <path d=\"M 110 122 Q 120 100 130 122 Q 128 130 120 132 Q 112 130 110 122 Z\" fill=\"#3a6a38\" stroke=\"#2a4a28\" stroke-width=\"1.2\"/>\n      <path d=\"M 115 120 Q 120 108 125 120 Q 122 124 120 124 Q 118 124 115 120 Z\" fill=\"#c9584a\" stroke=\"#8e3a30\" stroke-width=\"1\"/>\n    `;\n  }\n  // stage 5: full bloom + extras\n  const extras = Array.from({length: harvestCount}, (_, i) => {\n    const angle = (i / Math.max(1, harvestCount)) * Math.PI * 1.5 - 0.4;\n    const x = 120 + Math.cos(angle) * 50;\n    const y = 125 + Math.sin(angle) * 18;\n    return roseBloom(x, y, 14);\n  }).join('');\n  return `\n    <path d=\"M 120 200 L 120 108\" stroke=\"#3a6a38\" stroke-width=\"3.2\" fill=\"none\"/>\n    <path d=\"M 120 178 L 115 173 M 120 156 L 125 151 M 120 134 L 115 129\" stroke=\"#3a6a38\" stroke-width=\"1.5\"/>\n    ${roseLeaf(90, 170, -32)}\n    ${roseLeaf(150, 170, 32)}\n    ${roseLeaf(94, 148, -24)}\n    ${roseLeaf(146, 148, 24)}\n    ${roseLeaf(102, 128, -16)}\n    ${roseLeaf(138, 128, 16)}\n    ${roseBloom(120, 108, 18)}\n    ${extras}\n  `;\n}\nfunction roseLeaf(cx, cy, rot){\n  return `<g transform=\"translate(${cx} ${cy}) rotate(${rot})\">\n    <path d=\"M -11 0 Q -6 -7 0 -8 Q 6 -7 11 0 Q 6 7 0 8 Q -6 7 -11 0 Z\" fill=\"#4e8046\" stroke=\"#3a6a38\" stroke-width=\"1\"/>\n    <path d=\"M -10 0 L 10 0\" stroke=\"#3a6a38\" stroke-width=\"0.8\"/>\n  <\u002Fg>`;\n}\nfunction roseBloom(cx, cy, r){\n  return `<g transform=\"translate(${cx} ${cy})\">\n    <circle cx=\"0\" cy=\"0\" r=\"${r+2}\" fill=\"#8e3a30\"/>\n    <path d=\"M 0 -${r} Q -${r*0.8} -${r*0.6} -${r*0.9} 0 Q -${r*0.7} ${r*0.7} 0 ${r*0.8} Q ${r*0.7} ${r*0.7} ${r*0.9} 0 Q ${r*0.8} -${r*0.6} 0 -${r} Z\" fill=\"#c9584a\"/>\n    <path d=\"M 0 -${r*0.6} Q -${r*0.5} -${r*0.3} -${r*0.5} 0 Q -${r*0.4} ${r*0.4} 0 ${r*0.5} Q ${r*0.4} ${r*0.4} ${r*0.5} 0 Q ${r*0.5} -${r*0.3} 0 -${r*0.6} Z\" fill=\"#e07064\"/>\n    <circle cx=\"0\" cy=\"0\" r=\"${r*0.25}\" fill=\"#f3d388\"/>\n  <\u002Fg>`;\n}\n\n/* ---- Tomato / 番茄: bright green jagged leaves, red tomatoes ---- */\nfunction drawTomato(stageIdx, harvestCount){\n  if (stageIdx === 1) {\n    return `\n      <path d=\"M 120 200 L 120 172\" stroke=\"#6ba050\" stroke-width=\"2.8\" fill=\"none\"/>\n      <path d=\"M 120 178 Q 104 170 100 182 Q 112 183 120 180\" fill=\"#8bc46b\" stroke=\"#4a7d4a\" stroke-width=\"1\"/>\n      <path d=\"M 120 178 Q 136 170 140 182 Q 128 183 120 180\" fill=\"#8bc46b\" stroke=\"#4a7d4a\" stroke-width=\"1\"/>\n    `;\n  }\n  if (stageIdx === 2) {\n    return `\n      <path d=\"M 120 200 L 120 152\" stroke=\"#6ba050\" stroke-width=\"3\" fill=\"none\"/>\n      ${tomatoLeaf(98, 170, -30)}\n      ${tomatoLeaf(142, 170, 30)}\n      ${tomatoLeaf(104, 150, -18)}\n      ${tomatoLeaf(136, 150, 18)}\n    `;\n  }\n  if (stageIdx === 3) {\n    return `\n      <path d=\"M 120 200 L 120 130\" stroke=\"#6ba050\" stroke-width=\"3.2\" fill=\"none\"/>\n      ${tomatoLeaf(94, 172, -35)}\n      ${tomatoLeaf(146, 172, 35)}\n      ${tomatoLeaf(98, 150, -22)}\n      ${tomatoLeaf(142, 150, 22)}\n      ${tomatoLeaf(102, 128, -14)}\n      ${tomatoLeaf(138, 128, 14)}\n    `;\n  }\n  if (stageIdx === 4) {\n    return `\n      <path d=\"M 120 200 L 120 115\" stroke=\"#6ba050\" stroke-width=\"3.2\" fill=\"none\"/>\n      ${tomatoLeaf(90, 172, -38)}\n      ${tomatoLeaf(150, 172, 38)}\n      ${tomatoLeaf(96, 148, -24)}\n      ${tomatoLeaf(144, 148, 24)}\n      ${tomatoLeaf(104, 126, -14)}\n      ${tomatoLeaf(136, 126, 14)}\n      <!-- yellow tomato flowers (buds) -->\n      <g transform=\"translate(106 138)\"><path d=\"M -5 0 L 0 -5 L 5 0 L 0 5 Z M 0 -6 L 3 0 L 0 6 L -3 0 Z\" fill=\"#f3c96c\" stroke=\"#d69b3a\" stroke-width=\"0.8\"/><circle r=\"1.5\" fill=\"#fff4c4\"/><\u002Fg>\n      <g transform=\"translate(134 138)\"><path d=\"M -5 0 L 0 -5 L 5 0 L 0 5 Z M 0 -6 L 3 0 L 0 6 L -3 0 Z\" fill=\"#f3c96c\" stroke=\"#d69b3a\" stroke-width=\"0.8\"/><circle r=\"1.5\" fill=\"#fff4c4\"/><\u002Fg>\n      <g transform=\"translate(120 118)\"><path d=\"M -5 0 L 0 -5 L 5 0 L 0 5 Z M 0 -6 L 3 0 L 0 6 L -3 0 Z\" fill=\"#f3c96c\" stroke=\"#d69b3a\" stroke-width=\"0.8\"/><circle r=\"1.5\" fill=\"#fff4c4\"/><\u002Fg>\n    `;\n  }\n  // stage 5: mature with real tomatoes\n  const extras = Array.from({length: harvestCount}, (_, i) => {\n    const angle = (i / Math.max(1, harvestCount)) * Math.PI * 1.5 - 0.3;\n    const x = 120 + Math.cos(angle) * 46;\n    const y = 140 + Math.sin(angle) * 20;\n    return tomatoFruit(x, y, 9);\n  }).join('');\n  return `\n    <path d=\"M 120 200 L 120 108\" stroke=\"#6ba050\" stroke-width=\"3.2\" fill=\"none\"/>\n    ${tomatoLeaf(86, 172, -40)}\n    ${tomatoLeaf(154, 172, 40)}\n    ${tomatoLeaf(92, 148, -26)}\n    ${tomatoLeaf(148, 148, 26)}\n    ${tomatoLeaf(100, 124, -16)}\n    ${tomatoLeaf(140, 124, 16)}\n    ${tomatoFruit(104, 152, 9)}\n    ${tomatoFruit(136, 152, 9)}\n    ${tomatoFruit(120, 122, 11)}\n    ${extras}\n  `;\n}\nfunction tomatoLeaf(cx, cy, rot){\n  return `<g transform=\"translate(${cx} ${cy}) rotate(${rot})\">\n    <path d=\"M -14 0 Q -10 -6 -4 -5 L -2 -2 L 4 -7 L 6 -3 L 12 -6 L 14 0 L 12 6 L 6 3 L 4 7 L -2 2 L -4 5 Q -10 6 -14 0 Z\" fill=\"#6ba050\" stroke=\"#4a7d4a\" stroke-width=\"1\"/>\n  <\u002Fg>`;\n}\nfunction tomatoFruit(cx, cy, r){\n  return `<g transform=\"translate(${cx} ${cy})\">\n    <circle cx=\"0\" cy=\"1\" r=\"${r}\" fill=\"#c9584a\" stroke=\"#8e3a30\" stroke-width=\"1.2\"/>\n    <ellipse cx=\"-2\" cy=\"-2\" rx=\"${r*0.4}\" ry=\"${r*0.3}\" fill=\"#e07064\" opacity=\"0.7\"/>\n    <path d=\"M -4 -${r} L 0 -${r-2} L 4 -${r} L 2 -${r+3} L -2 -${r+3} Z\" fill=\"#4e8046\"/>\n  <\u002Fg>`;\n}\n\n/* ---- Cactus / 仙人掌: ribbed barrel with spines, pink flower at top ---- */\nfunction drawCactus(stageIdx, harvestCount){\n  if (stageIdx === 1) {\n    return `\n      <ellipse cx=\"120\" cy=\"188\" rx=\"10\" ry=\"14\" fill=\"#7fb26a\" stroke=\"#4a7d4a\" stroke-width=\"1.5\"/>\n      <path d=\"M 115 186 L 115 182 M 120 184 L 120 180 M 125 186 L 125 182\" stroke=\"#4a7d4a\" stroke-width=\"0.8\"/>\n    `;\n  }\n  if (stageIdx === 2) {\n    return `\n      <ellipse cx=\"120\" cy=\"175\" rx=\"16\" ry=\"26\" fill=\"#7fb26a\" stroke=\"#4a7d4a\" stroke-width=\"1.5\"/>\n      <path d=\"M 114 195 L 114 160 M 120 198 L 120 155 M 126 195 L 126 160\" stroke=\"#5a8a55\" stroke-width=\"0.8\" fill=\"none\"/>\n      ${cactusSpines(120, 175, 14, 24)}\n    `;\n  }\n  if (stageIdx === 3) {\n    // adds small arms\n    return `\n      <ellipse cx=\"120\" cy=\"165\" rx=\"18\" ry=\"34\" fill=\"#7fb26a\" stroke=\"#4a7d4a\" stroke-width=\"1.5\"/>\n      <ellipse cx=\"100\" cy=\"170\" rx=\"8\" ry=\"15\" fill=\"#7fb26a\" stroke=\"#4a7d4a\" stroke-width=\"1.5\"/>\n      <ellipse cx=\"140\" cy=\"170\" rx=\"8\" ry=\"15\" fill=\"#7fb26a\" stroke=\"#4a7d4a\" stroke-width=\"1.5\"/>\n      <path d=\"M 114 195 L 114 140 M 120 198 L 120 135 M 126 195 L 126 140\" stroke=\"#5a8a55\" stroke-width=\"0.8\" fill=\"none\"/>\n      ${cactusSpines(120, 165, 16, 32)}\n      ${cactusSpines(100, 170, 6, 13)}\n      ${cactusSpines(140, 170, 6, 13)}\n    `;\n  }\n  if (stageIdx === 4) {\n    // small pink buds at top\n    return `\n      <ellipse cx=\"120\" cy=\"155\" rx=\"20\" ry=\"42\" fill=\"#7fb26a\" stroke=\"#4a7d4a\" stroke-width=\"1.5\"/>\n      <ellipse cx=\"96\" cy=\"170\" rx=\"9\" ry=\"18\" fill=\"#7fb26a\" stroke=\"#4a7d4a\" stroke-width=\"1.5\"/>\n      <ellipse cx=\"144\" cy=\"170\" rx=\"9\" ry=\"18\" fill=\"#7fb26a\" stroke=\"#4a7d4a\" stroke-width=\"1.5\"/>\n      <path d=\"M 112 195 L 112 125 M 120 198 L 120 118 M 128 195 L 128 125\" stroke=\"#5a8a55\" stroke-width=\"0.8\" fill=\"none\"/>\n      ${cactusSpines(120, 155, 18, 40)}\n      ${cactusSpines(96, 170, 7, 16)}\n      ${cactusSpines(144, 170, 7, 16)}\n      <circle cx=\"112\" cy=\"118\" r=\"4\" fill=\"#f3a5d0\" stroke=\"#d67ab0\" stroke-width=\"1\"/>\n      <circle cx=\"128\" cy=\"118\" r=\"4\" fill=\"#f3a5d0\" stroke=\"#d67ab0\" stroke-width=\"1\"/>\n      <circle cx=\"96\" cy=\"154\" r=\"3\" fill=\"#f3a5d0\" stroke=\"#d67ab0\" stroke-width=\"1\"/>\n    `;\n  }\n  // stage 5: big cactus flower bloom\n  const extras = Array.from({length: harvestCount}, (_, i) => {\n    const angle = (i / Math.max(1, harvestCount)) * Math.PI * 1.7 - 0.2;\n    const r = 44;\n    const x = 120 + Math.cos(angle) * r;\n    const y = 150 + Math.sin(angle) * 30;\n    return cactusFlower(x, y, 8);\n  }).join('');\n  return `\n    <ellipse cx=\"120\" cy=\"150\" rx=\"22\" ry=\"48\" fill=\"#7fb26a\" stroke=\"#4a7d4a\" stroke-width=\"1.5\"/>\n    <ellipse cx=\"92\" cy=\"168\" rx=\"10\" ry=\"20\" fill=\"#7fb26a\" stroke=\"#4a7d4a\" stroke-width=\"1.5\"/>\n    <ellipse cx=\"148\" cy=\"168\" rx=\"10\" ry=\"20\" fill=\"#7fb26a\" stroke=\"#4a7d4a\" stroke-width=\"1.5\"/>\n    <path d=\"M 110 195 L 110 115 M 120 198 L 120 108 M 130 195 L 130 115\" stroke=\"#5a8a55\" stroke-width=\"0.8\" fill=\"none\"/>\n    ${cactusSpines(120, 150, 20, 46)}\n    ${cactusSpines(92, 168, 8, 18)}\n    ${cactusSpines(148, 168, 8, 18)}\n    ${cactusFlower(120, 108, 14)}\n    ${extras}\n  `;\n}\nfunction cactusSpines(cx, cy, rx, ry){\n  const pts = [];\n  const rows = Math.floor(ry/6);\n  for (let i=0; i<rows; i++) {\n    const y = cy - ry + i * (ry*2/rows) + 4;\n    pts.push(`<circle cx=\"${cx-rx+2}\" cy=\"${y}\" r=\"1\" fill=\"#f3d388\"/>`);\n    pts.push(`<circle cx=\"${cx}\" cy=\"${y}\" r=\"1\" fill=\"#f3d388\"/>`);\n    pts.push(`<circle cx=\"${cx+rx-2}\" cy=\"${y}\" r=\"1\" fill=\"#f3d388\"/>`);\n  }\n  return pts.join('');\n}\nfunction cactusFlower(cx, cy, r){\n  return `<g transform=\"translate(${cx} ${cy})\">\n    ${Array.from({length:8}, (_,i)=>{\n      const a = (i/8)*Math.PI*2;\n      return `<ellipse cx=\"${Math.cos(a)*r*0.7}\" cy=\"${Math.sin(a)*r*0.7}\" rx=\"${r*0.5}\" ry=\"${r*0.3}\" fill=\"#f3a5d0\" stroke=\"#d67ab0\" stroke-width=\"0.8\" transform=\"rotate(${i*45})\"/>`;\n    }).join('')}\n    <circle cx=\"0\" cy=\"0\" r=\"${r*0.35}\" fill=\"#f3d388\"/>\n    <circle cx=\"0\" cy=\"0\" r=\"${r*0.18}\" fill=\"#d69b3a\"/>\n  <\u002Fg>`;\n}\n\n/* ---- Monstera / 龟背竹: split leaves with holes ---- */\nfunction drawMonstera(stageIdx, harvestCount){\n  if (stageIdx === 1) {\n    return `\n      <path d=\"M 120 200 L 120 172\" stroke=\"#3a6a38\" stroke-width=\"2.8\" fill=\"none\"/>\n      <path d=\"M 120 178 Q 106 168 100 176 Q 112 180 120 180\" fill=\"#5a9a55\" stroke=\"#3a6a38\" stroke-width=\"1\"/>\n    `;\n  }\n  if (stageIdx === 2) {\n    return `\n      <path d=\"M 120 200 L 120 150\" stroke=\"#3a6a38\" stroke-width=\"3\" fill=\"none\"/>\n      ${monsteraLeaf(100, 165, -30, 0.7)}\n      ${monsteraLeaf(140, 158, 30, 0.85)}\n    `;\n  }\n  if (stageIdx === 3) {\n    return `\n      <path d=\"M 120 200 L 120 135\" stroke=\"#3a6a38\" stroke-width=\"3\" fill=\"none\"/>\n      ${monsteraLeaf(96, 170, -35, 0.85)}\n      ${monsteraLeaf(148, 168, 30, 1.0)}\n      ${monsteraLeaf(100, 140, -15, 0.9)}\n      ${monsteraLeaf(140, 138, 20, 0.95)}\n    `;\n  }\n  if (stageIdx === 4) {\n    return `\n      <path d=\"M 120 200 L 120 125\" stroke=\"#3a6a38\" stroke-width=\"3\" fill=\"none\"/>\n      ${monsteraLeaf(90, 172, -40, 1.0)}\n      ${monsteraLeaf(152, 172, 38, 1.0)}\n      ${monsteraLeaf(94, 142, -20, 1.05)}\n      ${monsteraLeaf(146, 142, 20, 1.05)}\n      ${monsteraLeaf(120, 125, 0, 1.1)}\n    `;\n  }\n  // stage 5: big monstera leaves, extras are extra-big leaves\n  const extras = Array.from({length: harvestCount}, (_, i) => {\n    const angle = (i / Math.max(1, harvestCount)) * Math.PI * 1.8 - 0.5;\n    const r = 55;\n    const x = 120 + Math.cos(angle) * r;\n    const y = 130 + Math.sin(angle) * 30;\n    const rot = Math.round((angle * 180 / Math.PI));\n    return monsteraLeaf(x, y, rot, 1.3);\n  }).join('');\n  return `\n    <path d=\"M 120 200 L 120 115\" stroke=\"#3a6a38\" stroke-width=\"3.2\" fill=\"none\"/>\n    ${monsteraLeaf(84, 174, -42, 1.1)}\n    ${monsteraLeaf(156, 174, 42, 1.1)}\n    ${monsteraLeaf(88, 142, -24, 1.15)}\n    ${monsteraLeaf(152, 142, 24, 1.15)}\n    ${monsteraLeaf(120, 112, 0, 1.25)}\n    ${extras}\n  `;\n}\nfunction monsteraLeaf(cx, cy, rot, scale){\n  const s = scale;\n  return `<g transform=\"translate(${cx} ${cy}) rotate(${rot}) scale(${s})\">\n    <path d=\"M -20 0 Q -18 -18 0 -20 Q 18 -18 20 0 Q 18 18 0 20 Q -18 18 -20 0 Z\" fill=\"#4e8046\" stroke=\"#3a6a38\" stroke-width=\"1.2\"/>\n    <!-- the characteristic slits -->\n    <path d=\"M -16 -6 L -4 -2 L -16 2 Z\" fill=\"#f7f2e4\"/>\n    <path d=\"M 16 -6 L 4 -2 L 16 2 Z\" fill=\"#f7f2e4\"/>\n    <path d=\"M -10 -14 L -4 -6 L -2 -14 Z\" fill=\"#f7f2e4\"/>\n    <path d=\"M 10 -14 L 4 -6 L 2 -14 Z\" fill=\"#f7f2e4\"/>\n    <circle cx=\"-6\" cy=\"8\" r=\"2\" fill=\"#f7f2e4\"/>\n    <circle cx=\"6\" cy=\"8\" r=\"2\" fill=\"#f7f2e4\"/>\n    <path d=\"M 0 -18 L 0 18\" stroke=\"#3a6a38\" stroke-width=\"0.8\"/>\n  <\u002Fg>`;\n}\n\nfunction shade(hex, percent) {\n  const n = parseInt(hex.slice(1), 16);\n  const r = Math.max(0, Math.min(255, (n >> 16) + percent * 2.55));\n  const g = Math.max(0, Math.min(255, ((n >> 8) & 0xff) + percent * 2.55));\n  const b = Math.max(0, Math.min(255, (n & 0xff) + percent * 2.55));\n  return '#' + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');\n}\n\nfunction getPetMood() {\n  const t = todayStr();\n  const todayDone = (state.completions[t] || []).length;\n  const sleep = state.sleep[t] || null;\n  if (todayDone >= 3 || sleep === 'before23') return 'happy';\n  if (todayDone >= 1) return 'neutral';\n  return 'sad';\n}\n\nfunction getPetMoodText() {\n  const mood = getPetMood();\n  const stage = getPetStage();\n  const n = state.pet.name;\n  const moodsZh = {\n    happy: [`${n}今天开心地在风里摇晃~`, `${n}说你做得真好呀!`, `${n}蹦蹦跳跳地过来抱你 ✿`, `今天的阳光，有${n}的份也有你的份`],\n    neutral: [`${n}安静地陪着你。`, `${n}在晒太阳，等你一起冒险。`, `${n}知道你在努力 ~`],\n    sad: [`${n}有点蔫蔫的，抱抱它？`, `${n}说没关系的，慢慢来。`, `${n}轻声说：一件小事就好。`]\n  };\n  const moodsEn = {\n    happy: [`${n} is swaying happily in the breeze ~`, `${n} says you're doing wonderfully!`, `${n} hops over for a hug ✿`, `Today's sunshine is for ${n} — and for you too`],\n    neutral: [`${n} is sitting quietly with you.`, `${n} is sunbathing, waiting for an adventure with you.`, `${n} sees how hard you're trying ~`],\n    sad: [`${n} is a little wilted — give it a hug?`, `${n} says it's okay, take it slow.`, `${n} whispers: just one tiny thing is enough.`]\n  };\n  const moods = getLang()==='en' ? moodsEn : moodsZh;\n  const arr = moods[mood];\n  const idx = (new Date().getDate() + stage) % arr.length;\n  return arr[idx];\n}\n\nfunction completeTask(taskId, partial = false) {\n  const task = state.tasks.find(t => t.id === taskId);\n  if (!task) return;\n  const t = todayStr();\n  if (!state.completions[t]) state.completions[t] = [];\n  if (task.type === 'daily' && state.completions[t].includes(taskId)) {\n    toast(T('今天已经完成过啦~', 'You already finished this today ~'), '🌼');\n    return;\n  }\n  state.completions[t].push(taskId);\n  const diffRewards = [5, 15, 30, 60];\n  let xp = diffRewards[task.difficulty - 1];\n  let stars = Math.max(2, Math.floor(xp * 0.5));\n  if (partial) {\n    xp = Math.floor(xp * 0.5);\n    stars = Math.floor(stars * 0.5);\n    toast(T(`启动成功！拿到一半奖励 +${xp}xp +${stars}✨`, `Started! Half reward +${xp}xp +${stars}✨`), '🌱');\n  } else {\n    toast(T(`完成「${task.name}」 +${xp}xp +${stars}✨`, `Done: “${task.name}” +${xp}xp +${stars}✨`), '✨');\n  }\n  const hour = new Date().getHours();\n  if (hour >= 1 && hour < 6) {\n    xp = Math.floor(xp * 0.5);\n    stars = Math.floor(stars * 0.5);\n    toast(T('深夜完成的任务奖励减半 🌙 早点休息哦', 'Late-night reward halved 🌙 try to rest soon'), '🌙');\n  }\n  // Record exactly what was granted so uncomplete can refund it precisely.\n  if (!state.rewardLog) state.rewardLog = {};\n  if (!state.rewardLog[t]) state.rewardLog[t] = {};\n  state.rewardLog[t][taskId] = { xp, stars, dim: task.dim, dimGain: Math.ceil(xp / 3) };\n  state.pet.xp += xp;\n  state.stars += stars;\n  state.dims[task.dim] += Math.ceil(xp / 3);\n  syncHarvestAfterXpChange();\n  if (!state.lastCompletionDate || state.lastCompletionDate !== t) {\n    const lastDay = state.lastCompletionDate;\n    if (lastDay) {\n      const d1 = new Date(lastDay), d2 = new Date(t);\n      const diff = (d2 - d1) / 86400000;\n      if (diff < 1.5) state.streak += 1;\n      else state.streak = 1;\n    } else {\n      state.streak = 1;\n    }\n    state.lastCompletionDate = t;\n  }\n  const newStage = getPetStage();\n  if (newStage > state.pet.stage) {\n    state.pet.stage = newStage;\n    setTimeout(() => {\n      toast(T(`${state.pet.name}进化了！现在是 ${PET_STAGES[newStage].name} 🎉`, `${state.pet.name} evolved! Now a ${PET_STAGES[newStage].nameEn} 🎉`), '🎊');\n    }, 400);\n  }\n  const card = maybeDropCard(task.difficulty);\n  if (card) {\n    setTimeout(() => {\n      toast(T(`掉落了卡片：${card.icon} ${card.name} (${rarityText(card.rarity)})`, `Card drop: ${card.icon} ${getCardName(card)} (${rarityText(card.rarity)})`), '🃏');\n    }, 700);\n  }\n  save();\n  renderAll();\n}\n\nfunction uncompleteTask(taskId) {\n  const t = todayStr();\n  if (!state.completions[t]) return;\n  const idx = state.completions[t].indexOf(taskId);\n  if (idx < 0) return;\n  const task = state.tasks.find(x => x.id === taskId);\n  // Prefer the exact reward log if present; otherwise fall back to the base reward table.\n  const log = state.rewardLog && state.rewardLog[t] && state.rewardLog[t][taskId];\n  if (log) {\n    state.pet.xp = Math.max(0, state.pet.xp - (log.xp||0));\n    state.stars = Math.max(0, state.stars - (log.stars||0));\n    if (log.dim) state.dims[log.dim] = Math.max(0, (state.dims[log.dim]||0) - (log.dimGain||0));\n    delete state.rewardLog[t][taskId];\n  } else if (task) {\n    const diffRewards = [5, 15, 30, 60];\n    let xp = diffRewards[task.difficulty - 1] || 0;\n    let stars = Math.max(2, Math.floor(xp * 0.5));\n    state.pet.xp = Math.max(0, state.pet.xp - xp);\n    state.stars = Math.max(0, state.stars - stars);\n    state.dims[task.dim] = Math.max(0, state.dims[task.dim] - Math.ceil(xp / 3));\n  }\n  state.pet.stage = getPetStage();\n  syncHarvestAfterXpChange();\n  state.completions[t].splice(idx, 1);\n  save();\n  renderAll();\n  toast(T('好的，取消打卡啦~经验已退回', 'Okay, un-checked ~ XP refunded'), '↩');\n}\n\n/* ============ Harvest system (extra fruits/flowers after max level) ============\n   Rules:\n   - Max stage is the last PET_STAGES entry. Its minXp is HARVEST_START.\n   - Past that, every HARVEST_STEP (=100) XP grows one extra fruit/flower/leaf.\n   - At the next day rollover, all grown harvest \"drops\" — each awards 100 stars,\n     and pet XP is reset to stage-4's minXp so you climb back to max for more. */\nconst HARVEST_STEP = 100;\nfunction harvestStart(){ return PET_STAGES[PET_STAGES.length - 1].minXp; }\nfunction stage4Xp(){ return PET_STAGES[PET_STAGES.length - 2].minXp; }\nfunction computeHarvestCount(xp){\n  if (xp < harvestStart()) return 0;\n  return Math.floor((xp - harvestStart()) / HARVEST_STEP);\n}\nfunction ensurePetFields(){\n  if (!state.pet.harvest) state.pet.harvest = [];\n  if (state.pet.lastHarvestXp == null) state.pet.lastHarvestXp = state.pet.xp;\n}\nfunction syncHarvestAfterXpChange(){\n  ensurePetFields();\n  const want = computeHarvestCount(state.pet.xp);\n  const have = (state.pet.harvest || []).length;\n  if (want > have) {\n    for (let i=0; i<want - have; i++) state.pet.harvest.push({ grownAt: Date.now() });\n    if (want - have > 0) {\n      setTimeout(() => {\n        const info = speciesInfo();\n        toast(T(`满级后多长出了一个${info.harvestZh} ${info.harvestEmoji}`, `An extra ${info.harvestEn} bloomed ${info.harvestEmoji}`), info.harvestEmoji);\n      }, 900);\n    }\n  } else if (want < have) {\n    // XP refund lowered count — drop the extras (not an awardable drop, just remove)\n    state.pet.harvest = state.pet.harvest.slice(0, Math.max(0, want));\n  }\n}\nfunction dropHarvestForNewDay(){\n  ensurePetFields();\n  const count = state.pet.harvest.length;\n  if (count <= 0) return;\n  const info = speciesInfo();\n  state.stars += count * 100;\n  state.pet.harvest = [];\n  state.pet.xp = stage4Xp(); // drop back to level 4\n  state.pet.stage = getPetStage();\n  state.pet.lastHarvestDate = todayStr();\n  save();\n  setTimeout(() => {\n    toast(T(`新的一天~ ${count} 个${info.harvestZh}掉落了，换来 ${count*100} ✨`, `New day ~ ${count} ${info.harvestEn}(s) fell — +${count*100} ✨`), info.harvestEmoji);\n  }, 600);\n}\n\nfunction rarityText(r) {\n  if (getLang()==='en') return { common: 'Common', rare: 'Rare', epic: 'Epic', legendary: 'Legendary' }[r];\n  return { common: '普通', rare: '稀有', epic: '珍藏', legendary: '传说' }[r];\n}\n\nfunction buyShopItem(id) {\n  const item = state.shopItems.find(i => i.id === id);\n  if (!item) return;\n  if (state.stars < item.price) {\n    toast(T('星星不够哦，再做一件事吧~', 'Not enough stars yet — do one more thing ~'), '🌰');\n    return;\n  }\n  const t = todayStr();\n  if (!state.shopPurchases[t]) state.shopPurchases[t] = {};\n  const used = state.shopPurchases[t][id] || 0;\n  if (item.limit && used >= item.limit) {\n    toast(T(`「${item.name}」今天已经兑换过啦`, `“${item.name}” already redeemed today`), '✋');\n    return;\n  }\n  state.stars -= item.price;\n  state.shopPurchases[t][id] = used + 1;\n  save();\n  renderAll();\n  toast(T(`获得：${item.icon} ${item.name}！请无罪恶感地享受 🌷`, `Got: ${item.icon} ${item.name}! Enjoy guilt-free 🌷`), '🎁');\n}\n\nfunction logSleep(type) {\n  const t = todayStr();\n  state.sleep[t] = type;\n  const bonus = { before23: 30, before24: 15, before1: 5, late: 0 };\n  const xp = bonus[type];\n  if (xp > 0) {\n    state.pet.xp += xp;\n    state.stars += Math.floor(xp / 2);\n    state.dims.health += Math.ceil(xp / 3);\n    toast(T(`今晚记录完成！+${xp}xp +${Math.floor(xp/2)}✨`, `Sleep logged! +${xp}xp +${Math.floor(xp/2)}✨`), '🌙');\n  } else {\n    toast(T('记录了。熬夜的话，明天对自己温柔一点 🫂', 'Logged. If it’s a late one, be gentle with yourself tomorrow 🫂'), '🌙');\n  }\n  const newStage = getPetStage();\n  if (newStage > state.pet.stage) {\n    state.pet.stage = newStage;\n  }\n  save();\n  renderAll();\n}\n\nfunction saveJournal() {\n  const txt = document.getElementById('journalInput').value.trim();\n  if (!txt) return;\n  state.journal.unshift({ date: todayStr(), time: new Date().toLocaleTimeString(getLang()==='en'?'en-US':'zh-CN', {hour:'2-digit', minute:'2-digit'}), text: txt });\n  document.getElementById('journalInput').value = '';\n  state.pet.xp += 5;\n  state.stars += 3;\n  state.dims.wisdom += 2;\n  save();\n  renderAll();\n  toast(T('记录下来了！+5xp', 'Saved! +5xp'), '✎');\n}\n\nfunction todayNotOK() {\n  const n = state.pet.name || '毛豆';\n  const en = getLang()==='en';\n  const variants = {\n    zh: [\n      { title:'抱抱你呀~', body:`${n}蹦过来贴贴你，今天什么都不用做，明天再说。`, btn:'好的，谢谢你~' },\n      { title:'今天好好休息', body:`${n}说：再小的事也算数。哪怕只是好好喝杯水。`, btn:'嗯，我试试' },\n      { title:'慢慢来~', body:`${n}轻轻地在你身边坐下，陪你一起发呆。🫧`, btn:'陪我一会儿吧' },\n      { title:'摆烂也没关系', body:`${n}偷偷告诉你：它也有蔫蔫的一天。我们一起摆烂~`, btn:'那就摆烂啦' },\n    ],\n    en: [\n      { title:'A little hug for you', body:`${n} hops over to lean on you. Today, nothing has to get done — tomorrow, we'll see.`, btn:'Thanks, ${n} ~' },\n      { title:'Rest is progress', body:`${n} says: the tiniest thing still counts — even just a sip of water.`, btn:`Okay, I'll try` },\n      { title:'Slow is fine', body:`${n} settles quietly beside you. 🫧`, btn:'Stay a while' },\n      { title:`Doing nothing is okay`, body:`${n} whispers: it has wilty days too. Let's wilt together~`, btn:'Let\\'s wilt' },\n    ],\n  };\n  const arr = en ? variants.en : variants.zh;\n  const pick = arr[Math.floor(Math.random()*arr.length)];\n  // Paint the seed portrait inside the modal (bigger & centered, with sparkles + cheeks)\n  const svg = buildComfortSeedSvg();\n  const seedHost = document.getElementById('comfortSeed');\n  seedHost.innerHTML = svg;\n  document.getElementById('comfortTitle').textContent = pick.title;\n  document.getElementById('comfortBody').textContent = pick.body;\n  document.getElementById('comfortHugBtn').textContent = pick.btn;\n  document.getElementById('comfortCloseBtn').textContent = en ? 'Close' : '关掉';\n  document.getElementById('comfortModal').classList.add('active');\n  // Release a few floating hearts inside the modal for warm feedback\n  releaseModalHearts(document.getElementById('comfortSparkles'));\n  // Still record today as \"checked-in\" so streak logic is gentle\n  const t = todayStr();\n  if (!state.completions[t]) state.completions[t] = [];\n  state.lastCompletionDate = t;\n  save();\n}\nfunction closeComfortModal(){\n  document.getElementById('comfortModal').classList.remove('active');\n}\nfunction buildComfortSeedSvg(){\n  // Use the same seed-face aesthetic as drawSeed(), sized for the modal (160px).\n  // Species seed color matches the user's current pet so it feels personal.\n  const species = (typeof getSpecies === 'function') ? getSpecies() : 'edamame';\n  const seedColor = { edamame:'#c7b186', rose:'#8a5c3a', tomato:'#b38050', cactus:'#9a7c52', monstera:'#7c6142' }[species] || '#c7b186';\n  const dark = (typeof shade === 'function') ? shade(seedColor, -20) : '#8a6a40';\n  return `<svg viewBox=\"0 0 160 160\" width=\"160\" height=\"160\" xmlns=\"http://www.w3.org/2000/svg\">\n    <!-- tiny hug arms (little leaf-like sleeves) -->\n    <path d=\"M 38 96 Q 28 90 32 78 Q 42 82 48 92 Z\" fill=\"#b4d68a\" stroke=\"#5a8a55\" stroke-width=\"2\" stroke-linejoin=\"round\"/>\n    <path d=\"M 122 96 Q 132 90 128 78 Q 118 82 112 92 Z\" fill=\"#9ac670\" stroke=\"#5a8a55\" stroke-width=\"2\" stroke-linejoin=\"round\"/>\n    <!-- seed body -->\n    <ellipse cx=\"80\" cy=\"92\" rx=\"42\" ry=\"34\" fill=\"${seedColor}\" stroke=\"${dark}\" stroke-width=\"3\"/>\n    <path d=\"M 52 86 Q 80 58 108 86\" stroke=\"${dark}\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\"/>\n    <ellipse cx=\"62\" cy=\"78\" rx=\"10\" ry=\"7\" fill=\"white\" opacity=\"0.25\"/>\n    <!-- closed-eye \"uwu\" face: warm, comforting -->\n    <path d=\"M 64 88 Q 69 84 74 88\" stroke=\"#3d3527\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"/>\n    <path d=\"M 86 88 Q 91 84 96 88\" stroke=\"#3d3527\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"/>\n    <!-- blushy cheeks -->\n    <ellipse cx=\"58\" cy=\"98\" rx=\"5\" ry=\"3.2\" fill=\"#f3a5d0\" opacity=\"0.65\"/>\n    <ellipse cx=\"102\" cy=\"98\" rx=\"5\" ry=\"3.2\" fill=\"#f3a5d0\" opacity=\"0.65\"/>\n    <!-- soft smile -->\n    <path d=\"M 72 104 Q 80 112 88 104\" stroke=\"#3d3527\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"/>\n    <!-- floating little heart -->\n    <path d=\"M 108 44 Q 104 38 100 44 Q 96 50 104 56 Q 112 50 108 44 Z\" fill=\"#f3a5d0\" stroke=\"#d67ab0\" stroke-width=\"1.5\" opacity=\"0.9\"/>\n    <path d=\"M 46 52 Q 43 48 40 52 Q 37 56 43 60 Q 49 56 46 52 Z\" fill=\"#f3a5d0\" opacity=\"0.75\"/>\n    <!-- sparkles -->\n    <text x=\"28\" y=\"30\" font-size=\"14\" fill=\"#f3d388\">✦<\u002Ftext>\n    <text x=\"128\" y=\"118\" font-size=\"12\" fill=\"#c4b5d9\">✦<\u002Ftext>\n  <\u002Fsvg>`;\n}\nfunction buildComfortBtnSvg(size = 26){\n  // Smaller version for the floating button — same face, no arms.\n  return `<svg viewBox=\"0 0 40 40\" width=\"${size}\" height=\"${size}\" xmlns=\"http://www.w3.org/2000/svg\">\n    <ellipse cx=\"20\" cy=\"22\" rx=\"14\" ry=\"12\" fill=\"#f7e5c4\" stroke=\"#a68663\" stroke-width=\"2\"/>\n    <path d=\"M 10 20 Q 20 10 30 20\" stroke=\"#a68663\" stroke-width=\"1.4\" fill=\"none\" opacity=\"0.6\"/>\n    <path d=\"M 14 22 Q 17 19 20 22\" stroke=\"#3d3527\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/>\n    <path d=\"M 20 22 Q 23 19 26 22\" stroke=\"#3d3527\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/>\n    <path d=\"M 16 28 Q 20 32 24 28\" stroke=\"#3d3527\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/>\n    <ellipse cx=\"12\" cy=\"26\" rx=\"2.2\" ry=\"1.4\" fill=\"#f3a5d0\" opacity=\"0.75\"/>\n    <ellipse cx=\"28\" cy=\"26\" rx=\"2.2\" ry=\"1.4\" fill=\"#f3a5d0\" opacity=\"0.75\"/>\n    <path d=\"M 33 10 Q 31 7 29 10 Q 27 13 31 15 Q 35 13 33 10 Z\" fill=\"#f3a5d0\" opacity=\"0.95\"/>\n  <\u002Fsvg>`;\n}\nfunction releaseModalHearts(host){\n  if (!host) return;\n  host.innerHTML = '';\n  for (let i=0; i<3; i++) {\n    const h = document.createElement('div');\n    h.textContent = '💕';\n    const dx = (Math.random()*140) - 70;\n    const delay = i * 160;\n    Object.assign(h.style, {\n      position: 'absolute',\n      left: '50%', top: '-12px',\n      transform: `translate(calc(-50% + ${dx}px), 0) scale(0.5)`,\n      opacity: '0',\n      fontSize: '22px',\n      color: '#f3a5d0',\n      pointerEvents: 'none',\n      transition: 'transform 1.4s cubic-bezier(.2,.8,.3,1), opacity 1.4s ease-out',\n    });\n    host.appendChild(h);\n    setTimeout(() => {\n      h.style.opacity = '1';\n      h.style.transform = `translate(calc(-50% + ${dx}px), -60px) scale(1)`;\n      setTimeout(() => {\n        h.style.opacity = '0';\n        h.style.transform = `translate(calc(-50% + ${dx}px), -110px) scale(0.9)`;\n      }, 700);\n      setTimeout(() => h.remove(), 1500);\n    }, delay);\n  }\n}\n\nfunction renderAll() {\n  renderHeader();\n  renderPet();\n  renderDims();\n  renderTasks();\n  renderShop();\n  renderCards();\n  renderJournal();\n  renderWeekChart();\n  renderSleepStatus();\n}\n\nfunction renderHeader() {\n  const d = new Date();\n  const en = getLang()==='en';\n  const weekdaysZh = ['周日','周一','周二','周三','周四','周五','周六'];\n  const weekdaysEn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\n  const monthsEn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n  document.getElementById('dateBadge').textContent = en\n    ? `${monthsEn[d.getMonth()]} ${d.getDate()} · ${weekdaysEn[d.getDay()]}`\n    : `${d.getMonth()+1}月${d.getDate()}日 · ${weekdaysZh[d.getDay()]}`;\n}\n\nfunction renderPet() {\n  ensurePetFields();\n  document.getElementById('petName').textContent = state.pet.name;\n  document.querySelectorAll('.pet-name-inline').forEach(el => el.textContent = state.pet.name);\n  const stageIdx = getPetStage();\n  const boxOpen = !!state.settings.seedOpened;\n  document.getElementById('petStage').textContent = boxOpen ? getPetStageName(stageIdx) : T('神秘种子盲盒','Mystery Seed Box');\n  document.getElementById('petSvg').innerHTML = getPetSvg(stageIdx, getPetMood());\n  document.getElementById('petMood').textContent = boxOpen ? getPetMoodText() : T('点下面的按钮，拆开你的第一颗种子吧~','Tap below to open your very first seed!');\n  // Blind-box button shows only before opening\n  document.getElementById('blindBoxArea').style.display = boxOpen ? 'none' : 'block';\n  document.getElementById('patBtn').style.display = boxOpen ? '' : 'none';\n  // Species badge\n  if (boxOpen) {\n    const info = speciesInfo();\n    const emoji = { edamame:'🫛', rose:'🌹', tomato:'🍅', cactus:'🌵', monstera:'🌿' }[getSpecies()];\n    document.getElementById('speciesBadge').textContent = `${emoji} ${getLang()==='en'?info.enName:info.zhName}`;\n  } else {\n    document.getElementById('speciesBadge').textContent = '🎁 ? ? ?';\n  }\n  // Harvest bar (visible when at max level with extras)\n  const hb = document.getElementById('harvestBar');\n  const harvestN = (state.pet.harvest||[]).length;\n  if (boxOpen && stageIdx >= PET_STAGES.length-1) {\n    const info = speciesInfo();\n    const xp = state.pet.xp;\n    const nextAt = harvestStart() + (harvestN + 1) * HARVEST_STEP;\n    const toNext = Math.max(0, nextAt - xp);\n    hb.style.display = 'block';\n    hb.innerHTML = harvestN > 0\n      ? T(`🎉 已结出 <b>${harvestN}<\u002Fb> 个${info.harvestZh} ${info.harvestEmoji} · 明日掉落换 ${harvestN*100}✨ · 再 ${toNext} 经验再长一个`,\n          `🎉 <b>${harvestN}<\u002Fb> ${info.harvestEn}(s) ${info.harvestEmoji} grown · drop tomorrow for ${harvestN*100}✨ · ${toNext} XP to next`)\n      : T(`满级！再 ${toNext} 经验就会长出第一个${info.harvestZh} ${info.harvestEmoji}`,\n          `Max level! ${toNext} XP to grow your first ${info.harvestEn} ${info.harvestEmoji}`);\n  } else {\n    hb.style.display = 'none';\n  }\n  const curStage = PET_STAGES[stageIdx];\n  const nextStage = PET_STAGES[stageIdx + 1];\n  const curFloor = curStage.minXp;\n  const nextFloor = nextStage ? nextStage.minXp : curFloor + 500;\n  const pct = Math.min(100, ((state.pet.xp - curFloor) / (nextFloor - curFloor)) * 100);\n  document.getElementById('xpFill').style.width = pct + '%';\n  document.getElementById('xpLabel').textContent = nextStage\n    ? T(`${state.pet.xp - curFloor} / ${nextFloor - curFloor} 经验`, `${state.pet.xp - curFloor} / ${nextFloor - curFloor} XP`)\n    : T(`满级啦! ${state.pet.xp} 总经验`, `Max level! ${state.pet.xp} total XP`);\n  document.getElementById('starCount').textContent = state.stars;\n  document.getElementById('streakCount').textContent = state.streak + ' ' + T('天', state.streak===1?'day':'days');\n  document.getElementById('shopStars').textContent = state.stars;\n  const power = Object.values(state.dims).reduce((a,b) => a+b, 0) + state.pet.xp;\n  document.getElementById('powerValue').textContent = power;\n}\n\nfunction renderDims() {\n  const en = getLang()==='en';\n  const dims = [\n    { key: 'career', name: en?'Career':'事业', icon: '💼', cls: 'dim-career' },\n    { key: 'charm',  name: en?'Charm':'魅力',  icon: '💖', cls: 'dim-charm' },\n    { key: 'wealth', name: en?'Wealth':'财富', icon: '💰', cls: 'dim-wealth' },\n    { key: 'wisdom', name: en?'Wisdom':'智慧', icon: '📚', cls: 'dim-wisdom' },\n    { key: 'health', name: en?'Health':'健康', icon: '🌿', cls: 'dim-health' },\n  ];\n  const html = dims.map(d => `\n    <div class=\"dim-card\">\n      <div class=\"dim-icon ${d.cls}\">${d.icon}<\u002Fdiv>\n      <div class=\"dim-name\">${d.name}<\u002Fdiv>\n      <div class=\"dim-value\">${state.dims[d.key]}<\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n  document.getElementById('dimsRow').innerHTML = html;\n}\n\nfunction renderTasks() {\n  const t = todayStr();\n  const todayDone = state.completions[t] || [];\n  const dimIcons = { career: '💼', charm: '💖', wealth: '💰', wisdom: '📚', health: '🌿' };\n  const diffTags = getLang()==='en' ? ['🌱 Tiny','🌿 Normal','🌳 Challenge','🌲 Big'] : ['🌱小事', '🌿一般', '🌳挑战', '🌲大事'];\n  const diffXp = [5, 15, 30, 60];\n\n  const renderTaskRow = (task) => {\n    const done = todayDone.includes(task.id);\n    return `\n      <div class=\"task ${done ? 'done' : ''}\" onclick=\"${done ? `uncompleteTask('${task.id}')` : `completeTask('${task.id}')`}\">\n        <div class=\"task-check\"><\u002Fdiv>\n        <div class=\"task-body\">\n          <div class=\"task-name\">${escapeHtml(task.name)}<\u002Fdiv>\n          <div class=\"task-meta\">\n            <span class=\"tag\">${dimIcons[task.dim]} ${(getLang()==='en' ? {career:'Career',charm:'Charm',wealth:'Wealth',wisdom:'Wisdom',health:'Health'} : {career:'事业',charm:'魅力',wealth:'财富',wisdom:'智慧',health:'健康'})[task.dim]}<\u002Fspan>\n            <span class=\"tag\">${diffTags[task.difficulty - 1]}<\u002Fspan>\n            ${task.type === 'once' ? `<span class=\"tag\">${T('一次性','One-time')}<\u002Fspan>` : ''}\n          <\u002Fdiv>\n        <\u002Fdiv>\n        ${!done ? `<button class=\"task-start-btn\" onclick=\"event.stopPropagation(); startTaskPartial('${task.id}')\" title=\"只要开始 5 分钟就算\">启动 ▸<\u002Fbutton>` : ''}\n        <div class=\"task-reward\">+${diffXp[task.difficulty - 1]}xp<\u002Fdiv>\n      <\u002Fdiv>\n    `;\n  };\n\n  const homeVisible = state.tasks.filter(task => {\n    if (task.type === 'daily') return true;\n    if (task.type === 'once' && !todayDone.includes(task.id)) return true;\n    return false;\n  }).slice(0, 8);\n\n  document.getElementById('homeTaskList').innerHTML = homeVisible.length\n    ? homeVisible.map(renderTaskRow).join('')\n    : `<div class=\"empty\">${T('还没有任务，点下方加一个 🌱','No tasks yet — add one below 🌱')}<\u002Fdiv>`;\n\n  const doneCount = state.tasks.filter(t2 => t2.type === 'daily' && todayDone.includes(t2.id)).length;\n  const totalDaily = state.tasks.filter(t2 => t2.type === 'daily').length;\n  document.getElementById('todayProgress').textContent = `${doneCount}/${totalDaily}`;\n\n  const onceTasks = state.tasks.filter(task => task.type === 'once');\n  const dailyTasks = state.tasks.filter(task => task.type === 'daily');\n\n  document.getElementById('oneTimeList').innerHTML = onceTasks.length\n    ? onceTasks.map(task => `${renderTaskRow(task)}`).join('')\n    : `<div class=\"empty\">${T('还没有一次性任务','No one-time tasks yet')}<\u002Fdiv>`;\n\n  document.getElementById('dailyList').innerHTML = dailyTasks.length\n    ? dailyTasks.map(task => `\n        <div style=\"display: flex; align-items: center; gap: 8px; position: relative;\">\n          <div style=\"flex:1;\">${renderTaskRow(task)}<\u002Fdiv>\n          <button class=\"quick-btn\" onclick=\"deleteTask('${task.id}')\" style=\"padding: 6px 10px; font-size: 12px;\">🗑<\u002Fbutton>\n        <\u002Fdiv>\n      `).join('')\n    : `<div class=\"empty\">${T('还没有每日任务','No daily tasks yet')}<\u002Fdiv>`;\n}\n\nfunction startTaskPartial(id) {\n  if (confirm(T('启动这件事 5 分钟，先拿一半奖励？完成后可以再点一次勾拿剩下的。','Start this for 5 min and get half the reward now? Tap the check again when done to get the rest.'))) {\n    completeTask(id, true);\n  }\n}\n\nfunction deleteTask(id) {\n  if (!confirm(T('确定删掉这个任务吗？','Delete this task?'))) return;\n  state.tasks = state.tasks.filter(t => t.id !== id);\n  save();\n  renderAll();\n}\n\nfunction renderShop() {\n  const t = todayStr();\n  const purchases = state.shopPurchases[t] || {};\n  const html = state.shopItems.map(item => {\n    const used = purchases[item.id] || 0;\n    const limitReached = item.limit && used >= item.limit;\n    const canAfford = state.stars >= item.price;\n    const disabled = limitReached || !canAfford;\n    return `\n      <div class=\"shop-item\">\n        <div class=\"shop-item-icon\">${item.icon}<\u002Fdiv>\n        <div class=\"shop-item-name\">${escapeHtml(item.name)}<\u002Fdiv>\n        <div class=\"shop-item-desc\">${escapeHtml(item.desc || '')}<\u002Fdiv>\n        <button class=\"shop-buy-btn\" ${disabled ? 'disabled' : ''} onclick=\"buyShopItem('${item.id}')\">\n          ${limitReached ? T('今日已兑换','Redeemed today') : `✨ ${item.price} ${T('颗星','stars')}`}\n        <\u002Fbutton>\n        ${item.limit ? `<div style=\"font-size:11px; color: var(--ink-soft); text-align: center; margin-top: 6px;\">${T('今日','Today')} ${used}/${item.limit}<\u002Fdiv>` : ''}\n        <button class=\"edit-btn\" style=\"position: absolute; top: 8px; right: 8px; background: none; border: none; cursor: pointer; opacity: 0.4;\" onclick=\"deleteShopItem('${item.id}')\">×<\u002Fbutton>\n      <\u002Fdiv>\n    `;\n  }).join('');\n  document.getElementById('shopGrid').innerHTML = html;\n}\n\nfunction deleteShopItem(id) {\n  if (!confirm(T('删除这个奖励？','Delete this reward?'))) return;\n  state.shopItems = state.shopItems.filter(i => i.id !== id);\n  save();\n  renderAll();\n}\n\nlet cardFilter = 'all';\nfunction filterCards(f) { cardFilter = f; renderCards(); }\n\nfunction renderCards() {\n  let pool = CARD_POOL;\n  if (cardFilter !== 'all') pool = pool.filter(c => c.dim === cardFilter);\n  const html = pool.map(c => {\n    const count = state.cards[c.id] || 0;\n    const locked = count === 0;\n    return `\n      <div class=\"card-item card-${c.rarity} ${locked ? 'locked' : ''}\">\n        <div class=\"card-rarity\">${rarityText(c.rarity)}<\u002Fdiv>\n        <div class=\"card-icon\">${locked ? '❓' : c.icon}<\u002Fdiv>\n        <div class=\"card-name\">${locked ? '???' : c.name}<\u002Fdiv>\n        ${count > 0 ? `<div class=\"card-count\">×${count}<\u002Fdiv>` : ''}\n      <\u002Fdiv>\n    `;\n  }).join('');\n  document.getElementById('cardsGrid').innerHTML = html;\n}\n\nfunction renderJournal() {\n  renderMood();\n  const html = state.journal.slice(0, 20).map(j => `\n    <div class=\"insight-card\" style=\"margin-bottom: 10px;\">\n      <div style=\"font-family: 'Caveat', cursive; color: var(--peach-deep); margin-bottom: 6px; font-size: 14px;\">${j.date} ${j.time || ''}<\u002Fdiv>\n      ${escapeHtml(j.text).replace(/\\n/g, '<br>')}\n    <\u002Fdiv>\n  `).join('');\n  document.getElementById('journalList').innerHTML = html || `<div class=\"empty\">${T('还没有记录过什么，试试写一句？','Nothing written yet — try a line?')}<\u002Fdiv>`;\n}\n\nfunction renderWeekChart() {\n  const days = [];\n  for (let i = 6; i >= 0; i--) {\n    const d = new Date();\n    d.setDate(d.getDate() - i);\n    const key = d.toISOString().slice(0,10);\n    days.push({\n      key,\n
